<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Recepten">
<meta name="theme-color" content="#f7f4ed">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Recepten</title>
<!-- Recepten, versie 1.0.1 – zusje van de Gedichten. Gemaakt voor de iPad aan de muur (Safari 14) en jullie telefoons. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Caveat:wght@400;500;600&display=swap" rel="stylesheet" crossorigin="anonymous" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Caveat:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
<style>
/* Let op voor de iPad (Safari 14.0): geen gap bij flexbox, geen :has(), geen aspect-ratio, geen inset. Grid-gap mag wel. */
*{box-sizing:border-box}
:root{--papier:#f7f4ed;--achter:#eee9df;--inkt:#302c26;--zacht:#887e70;--lijn:#d5cdbf;--accent:#b5654a;--accent-donker:#8f4a33;--accent-zacht:rgba(181,101,74,.12);--ramon:#7895a3;--ramon-donker:#4f6976;--sanne:#b88a54;--sanne-donker:#76552f;--schaal:1}
html{background:#fff;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--achter);color:var(--inkt);font-family:'Cormorant Garamond',Georgia,serif;font-size:19px}
button,input,select,textarea{font-family:inherit;color:inherit}
[hidden]{display:none!important}
.page{max-width:900px;min-height:100vh;margin:0 auto;padding:72px 60px 160px;background:linear-gradient(to bottom,#fff 0,#fff 25px,var(--papier) 75px,var(--achter) 160px)}
@media(max-width:600px){.page{padding:58px 18px 150px}}
.datum{margin:0 0 10px;color:#a3957f;font-size:14px;letter-spacing:.2em;text-transform:uppercase;text-align:center}
h1{font-size:calc(42px * var(--schaal));font-weight:500;line-height:1.1;margin:0 0 8px;text-align:center}
@media(max-width:600px){h1{font-size:calc(34px * var(--schaal))}}
h2{font-size:26px;font-weight:500;margin:30px 0 10px}
.sub{color:var(--zacht);font-style:italic;text-align:center;font-size:20px;margin:0}
.uitleg{color:#8b8172;font-size:16px;font-style:italic;line-height:1.4;margin:6px 0 12px}
.midden{text-align:center}
.ornament{display:flex;align-items:center;justify-content:center;margin:16px auto 24px;max-width:320px}
.ornament .l,.ornament .r{flex:1;height:1px}
.ornament .l{background:linear-gradient(to right,rgba(201,184,156,0),#c9b89c)}
.ornament .r{background:linear-gradient(to left,rgba(201,184,156,0),#c9b89c)}
.ornament i{display:block;width:7px;height:7px;margin:0 12px;border:1px solid var(--accent);background:var(--accent-zacht);transform:rotate(45deg)}
.knop{display:inline-block;min-height:46px;margin:5px 4px;border:1px solid rgba(151,133,108,.45);border-radius:3px;padding:9px 16px;background:#fffdf8;font-size:18px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;color:var(--inkt);vertical-align:middle;text-align:center}
.knop:active{background:#e9e1d4}
.knop.hoofd{background:var(--accent);border-color:var(--accent);color:#fffaf4;font-weight:600}
.knop.hoofd:active{background:var(--accent-donker)}
.knop.klein{min-height:36px;padding:5px 11px;font-size:16px}
.knop:disabled{opacity:.45}
.link{border:0;background:none;padding:4px 2px;color:#8a6845;border-bottom:1px solid currentColor;font-size:16px;cursor:pointer}
.segmented{display:flex;border:1px solid rgba(151,133,108,.45);border-radius:3px;overflow:hidden;background:rgba(255,253,248,.6)}
.segmented button{flex:1;min-height:44px;border:0;padding:6px 6px;background:transparent;color:#776d60;font-size:17px;line-height:1.15;cursor:pointer}
.segmented button+button{border-left:1px solid rgba(151,133,108,.45)}
.segmented button.active{background:#e9e1d4;color:var(--inkt);font-weight:600}
.kaart{position:relative;margin:0 0 22px;background:#fffdf8;border:1px solid rgba(151,133,108,.22);border-radius:3px;padding:24px 24px 18px;box-shadow:0 1px 1px rgba(80,60,20,.06),0 8px 20px rgba(80,60,20,.08)}
.plakband{position:absolute;left:50%;top:-11px;width:96px;height:22px;margin-left:-48px;background:rgba(255,255,255,.62);box-shadow:0 1px 2px rgba(0,0,0,.05);transform:rotate(-2.5deg)}
.chip{display:inline-block;padding:2px 11px;border-radius:999px;font-size:15px;margin:0 4px 4px 0;border:1px solid rgba(151,133,108,.35);background:rgba(255,253,248,.75);color:#5f5547;white-space:nowrap}
.chip.Ramon{color:var(--ramon-donker);background:rgba(112,145,160,.16);border-color:rgba(120,149,163,.45)}
.chip.Sanne{color:var(--sanne-donker);background:rgba(182,145,96,.16);border-color:rgba(184,138,84,.45)}
.chip.Samen{color:#5f5547;background:linear-gradient(90deg,rgba(112,145,160,.22),rgba(182,145,96,.22));border-color:rgba(151,133,108,.45)}
.chip.knopchip{cursor:pointer}
.chip.knopchip.active{background:#e9e1d4;color:var(--inkt);font-weight:600}
.stip{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;background:#b8ad9d}
.stip.Ramon{background:var(--ramon)}.stip.Sanne{background:var(--sanne)}.stip.Voorraad{background:var(--accent)}
.cijfers{font-family:Caveat,cursive;font-size:25px;line-height:1.1}
.cijfers .Ramon{color:var(--ramon-donker)}.cijfers .Sanne{color:var(--sanne-donker)}
.cijfers .wacht{font-family:'Cormorant Garamond',Georgia,serif;font-size:15px;font-style:italic;color:var(--zacht)}
.hart{color:#c2453b}
.letop{position:relative;margin:16px 0;padding:12px 16px 12px 46px;background:linear-gradient(to right,rgba(181,101,74,.15),rgba(181,101,74,.04));border-left:3px solid var(--accent);border-radius:2px;font-size:18px;line-height:1.4;text-align:left}
.letop:before{content:"!";position:absolute;left:13px;top:11px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;text-align:center;line-height:22px;font-family:Georgia,serif;font-size:14px}
.letop b{font-weight:600}
.melding{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40000;max-width:min(92vw,560px);padding:10px 16px;border-radius:12px;background:#302c26;color:#f7f4ed;font-size:17px;line-height:1.3;box-shadow:0 6px 20px rgba(35,30,24,.25);display:flex;align-items:center}
.melding button{margin-left:14px;border:0;background:none;color:#f3c9a8;font-size:17px;text-decoration:underline;cursor:pointer;white-space:nowrap}
.verbinding{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:10001;padding:5px 12px;border-radius:12px;background:rgba(247,244,237,.94);border:1px solid rgba(151,133,108,.3);color:#8a7f70;font-size:14px;font-style:italic;white-space:nowrap;pointer-events:none}

/* Vanavond */
.vanavond-kaart{text-align:center;padding:30px 26px 22px}
.vanavond-kaart h2{margin:8px 0 6px;font-size:calc(34px * var(--schaal));line-height:1.15}
.vraag-kaart{text-align:center;background:linear-gradient(to bottom,rgba(255,253,248,.96),rgba(250,245,236,.96))}
.vraag-kaart p{margin:0 0 8px;font-size:21px}
.strook{margin:6px 0 0}
.status-regel{margin:22px 0 0;text-align:center;color:#6f675b;font-size:18px}
.status-regel a{color:#8a6845}

/* Recepten */
.zoekbalk{display:flex;align-items:center;margin:0 0 12px}
.zoekbalk input{flex:1;min-height:46px;border:1px solid #cfc5b5;border-radius:3px;padding:9px 12px;background:#fffdf8;font-size:18px;-webkit-appearance:none}
.filters{margin:0 0 6px}
.raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));grid-gap:28px 20px;gap:28px 20px;margin-top:24px}
.receptkaart{margin:0;cursor:pointer;min-height:150px;transform:rotate(var(--draai,0deg));-webkit-tap-highlight-color:transparent;transition:transform 200ms ease}
.receptkaart:active{transform:rotate(var(--draai,0deg)) scale(.98)}
.receptkaart h3{margin:4px 0 6px;font-size:25px;font-weight:500;line-height:1.15}
.meta{color:var(--zacht);font-size:16px;font-style:italic}
.nieuw-kaart{display:flex;align-items:center;justify-content:center;min-height:150px;border:1px dashed rgba(151,133,108,.6);border-radius:3px;background:rgba(255,253,248,.5);color:#6f6253;font-size:21px;cursor:pointer}
.nieuw-kaart span{color:var(--accent);font-size:28px;margin-right:8px}

/* Eén recept */
.personen{display:flex;align-items:center;justify-content:center;margin:12px 0 4px}
.personen button{width:48px;height:48px;border-radius:50%;border:1px solid rgba(151,133,108,.45);background:#fffdf8;font-size:26px;line-height:1;cursor:pointer;padding:0}
.personen span{min-width:150px;text-align:center;font-size:22px}
.kolommen{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);grid-gap:36px;gap:36px;margin-top:8px}
@media(max-width:720px){.kolommen{grid-template-columns:minmax(0,1fr);grid-gap:6px;gap:6px}}
.groep-kop{margin:18px 0 4px;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#a3957f}
.ingr{position:relative;padding:8px 6px;border-bottom:1px solid rgba(213,205,191,.7);font-size:calc(19px * var(--schaal));line-height:1.3;border-radius:2px;transform-origin:left center;transition:background-color 200ms ease,transform 380ms cubic-bezier(.22,1,.36,1)}
.ingr .h{display:inline-block;min-width:78px;font-weight:600;font-variant-numeric:lining-nums tabular-nums}
.ingr .noot{color:var(--zacht);font-style:italic;font-size:.88em}
.ingr .kast{display:block;padding-left:78px;color:#8a7a5f;font-size:14px;font-style:italic}
.ingr .kast.weinig{color:#b0442f}
.stap{position:relative;margin:0 0 12px;padding:10px 12px 10px 48px;font-size:calc(21px * var(--schaal));line-height:1.45;border-radius:3px;transform-origin:left center;transition:transform 380ms cubic-bezier(.22,1,.36,1),background-color 200ms ease}
.stap .nr{position:absolute;left:8px;top:10px;width:28px;height:28px;border-radius:50%;border:1px solid var(--accent);color:var(--accent);text-align:center;line-height:26px;font-size:16px;font-weight:600}
.stap .stap-letop{display:block;margin-top:6px;color:var(--accent-donker);font-size:.84em;font-style:italic}
.stap .stap-timer{display:inline-block;margin:4px 0 0 8px;font-size:15px;color:#8a6845}
.vergroot{transform:scale(1.09);font-weight:600;background:rgba(255,253,248,.95);z-index:2;box-shadow:0 6px 18px rgba(80,60,20,.08)}
.aangewezen{background:rgba(255,190,70,.24);box-shadow:0 0 0 2px rgba(190,130,50,.16)}
.ingr.aangewezen{background:rgba(38,183,190,.18);box-shadow:0 0 0 2px rgba(38,150,160,.14)}
.stap.bladwijzer{background:rgba(255,190,70,.13)}
.bel{position:absolute;z-index:9500;max-width:280px;padding:8px 12px;border-radius:10px;background:var(--inkt);color:var(--papier);font-size:16px;line-height:1.3;pointer-events:none;box-shadow:0 6px 18px rgba(35,30,24,.25)}
.acties{margin:28px 0 0;text-align:center}

/* Koken */
body.koken .page{max-width:none;padding:22px 26px 150px;background:var(--papier)}
.kook-kop{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.kook-kop .titel{font-size:21px;color:var(--zacht);font-style:italic;flex:1;padding:0 12px;text-align:center}
.kook-voortgang{display:flex;margin:0 0 18px}
.kook-voortgang i{flex:1;height:5px;margin-right:4px;border-radius:3px;background:#ddd3c3}
.kook-voortgang i.gedaan{background:var(--accent)}
.kook-voortgang i.nu{background:#e2a98f}
.kook-vlak{position:relative;min-height:56vh;max-width:860px;margin:0 auto}
.kook-zone{position:absolute;top:0;bottom:0;width:50%;z-index:1;-webkit-tap-highlight-color:transparent}
.kook-zone.links{left:0}.kook-zone.rechts{right:0}
.kook-inhoud{position:relative;z-index:2;pointer-events:none}
.kook-inhoud .knop,.kook-inhoud button{pointer-events:auto}
.kook-nr{color:var(--accent);font-size:18px;letter-spacing:.18em;text-transform:uppercase;margin:6px 0 6px}
.kook-stap{font-size:calc(34px * var(--schaal));line-height:1.35;margin:0 0 18px}
@media(max-width:600px){.kook-stap{font-size:calc(27px * var(--schaal))}}
.kook-ingr{margin:0 0 16px;font-size:22px;color:#5f5547}
.kook-ingr div{padding:3px 0}
.kook-ingr b{font-weight:600;color:var(--inkt)}
.kook-hint{display:flex;justify-content:space-between;color:#b3a795;font-size:15px;font-style:italic;margin-top:26px}
.vooruit{font-size:17px}
.vooruit:before{background:#d99a7f}

/* Timers */
.timer-strook{position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:12000;display:flex;flex-wrap:wrap;justify-content:center;max-width:94vw}
.timer{margin:0 4px 6px;padding:7px 15px;border-radius:999px;background:var(--inkt);color:var(--papier);font-size:18px;box-shadow:0 4px 14px rgba(35,30,24,.2);border:0;cursor:pointer;font-variant-numeric:tabular-nums}
.timer.klaar{background:#c2453b;-webkit-animation:knipper 1s infinite;animation:knipper 1s infinite}
@-webkit-keyframes knipper{50%{opacity:.55}}
@keyframes knipper{50%{opacity:.55}}

/* Weekmenu */
.dag{position:relative;display:flex;align-items:center;padding:14px 10px 14px 20px;border-bottom:1px solid rgba(213,205,191,.75);cursor:pointer;-webkit-tap-highlight-color:transparent}
.dag:before{content:"";position:absolute;left:4px;top:10px;bottom:10px;width:5px;border-radius:3px;background:transparent}
.dag.Ramon:before{background:var(--ramon)}.dag.Sanne:before{background:var(--sanne)}.dag.Samen:before{background:linear-gradient(var(--ramon),var(--sanne))}
.dag.vandaag{background:rgba(255,253,248,.85)}
.dag:active{background:#ece5d9}
.dag .naam{width:118px;flex:0 0 auto;font-size:16px;color:var(--zacht);line-height:1.2}
.dag .naam b{display:block;color:var(--inkt);font-size:20px;font-weight:600}
.dag .wat{flex:1;font-size:21px;line-height:1.25}
.dag .leeg{color:#b3a795;font-style:italic}
.kies-lijst{max-height:42vh;overflow-y:auto;-webkit-overflow-scrolling:touch;border:1px solid rgba(151,133,108,.3);border-radius:3px;background:#fffdf8;margin:8px 0 14px}
.kies-item{display:block;width:100%;border:0;border-bottom:1px solid rgba(213,205,191,.75);padding:11px 12px;background:transparent;text-align:left;font-size:19px;cursor:pointer}
.kies-item.active{background:var(--accent-zacht);font-weight:600}
.dagkeuze{display:flex;flex-wrap:wrap;margin:6px 0 12px}
.dagkeuze button{margin:0 6px 6px 0;min-height:40px;padding:4px 10px;border:1px solid rgba(151,133,108,.45);border-radius:3px;background:#fffdf8;font-size:16px;cursor:pointer}
.dagkeuze button.active{background:#e9e1d4;font-weight:600}

/* Boodschappen */
.onderweg{margin:14px 0;padding:10px 14px;border-radius:12px;background:rgba(48,44,38,.92);color:var(--papier);text-align:center;font-size:18px}
.toevoegen{display:flex;margin:16px 0 8px}
.toevoegen input{flex:1;min-height:48px;margin-right:8px;border:1px solid #cfc5b5;border-radius:3px;padding:10px 12px;background:#fffdf8;font-size:18px;-webkit-appearance:none}
.toevoegen .knop{margin:0}
.afdeling{margin:20px 0 2px;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#a3957f}
.item{display:flex;align-items:center;padding:10px 2px;border-bottom:1px solid rgba(213,205,191,.75)}
.item .vink{flex:0 0 auto;position:relative;width:32px;height:32px;margin-right:12px;border:1.5px solid #b3a795;border-radius:50%;background:#fffdf8;padding:0;cursor:pointer}
.item.gekocht .vink{background:var(--accent);border-color:var(--accent)}
.item.gekocht .vink:after{content:"";position:absolute;left:10px;top:4px;width:8px;height:15px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.item .wat{flex:1;font-size:20px;line-height:1.25;cursor:pointer}
.item.gekocht .wat{text-decoration:line-through;color:#a39886}
.item .waarom{display:block;font-size:14px;color:var(--zacht);font-style:italic;text-decoration:none}
.item .mini{flex:0 0 auto;margin-left:6px;min-width:44px;min-height:38px;border:1px solid rgba(151,133,108,.35);border-radius:3px;background:#fffdf8;color:#766b5d;font-size:15px;cursor:pointer}

/* Kast */
.product{display:flex;align-items:center;padding:10px 2px;border-bottom:1px solid rgba(213,205,191,.75)}
.product .naam{flex:1;font-size:20px;line-height:1.2;cursor:pointer}
.product .naam small{display:block;color:var(--zacht);font-size:14px;font-style:italic}
.teller{display:flex;align-items:center;flex:0 0 auto}
.teller button{width:52px;height:52px;border-radius:50%;border:1px solid rgba(151,133,108,.45);background:#fffdf8;font-size:28px;line-height:1;cursor:pointer;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.teller button:active{background:#e9e1d4}
.teller .aantal{min-width:58px;text-align:center;font-family:Caveat,cursive;font-size:38px;line-height:1}
.product.laag .aantal{color:#c2453b}
.niveaus{flex:0 0 auto;width:300px;max-width:58%}
.niveaus button{font-size:15px;min-height:42px}

/* Modals */
.modal-backdrop{display:none;position:fixed;top:0;right:0;bottom:0;left:0;z-index:20000;background:rgba(35,30,24,.42);padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-backdrop.zichtbaar{display:block}
.modal{width:100%;max-width:540px;margin:4vh auto;background:var(--papier);border:1px solid var(--lijn);border-radius:4px;padding:26px;box-shadow:0 12px 40px rgba(35,30,24,.2)}
@media(max-width:600px){.modal{padding:20px;margin:2vh auto}}
.modal h2{margin:0 0 10px;font-size:28px}
.modal-acties{display:flex;justify-content:flex-end;align-items:center;flex-wrap:wrap;margin-top:16px}
.modal-acties .knop{margin:6px 0 0 10px}
.veld{display:block;margin:0 0 12px}
.veld>span{display:block;font-size:16px;color:#5f5547;margin-bottom:4px}
.tekst{width:100%;border:1px solid #cfc5b5;border-radius:2px;background:#fffdf8;padding:9px 11px;font-size:18px;-webkit-appearance:none;appearance:none}
textarea.tekst{min-height:80px;line-height:1.4;resize:vertical}
select.tekst{-webkit-appearance:menulist;appearance:menulist}
.keus{display:flex;align-items:center;padding:9px 2px;border-bottom:1px solid rgba(213,205,191,.7);cursor:pointer}
.keus input[type=checkbox]{flex:0 0 auto;width:26px;height:26px;margin:0 12px 0 0}
.keus .tekst2{flex:1;font-size:19px;line-height:1.25}
.keus small{display:block;color:var(--zacht);font-style:italic;font-size:14px}
.keus .mini{flex:0 0 auto;margin-left:8px;min-width:52px;min-height:36px;border:1px solid rgba(151,133,108,.45);border-radius:3px;background:#fffdf8;font-size:15px;cursor:pointer}
.keus .niveaus{width:250px}
.persoonkeuze{display:flex;margin:0 0 6px}
.persoonkeuze button{flex:1;min-height:52px;margin-right:10px;border:1px solid transparent;border-radius:3px;padding:9px 14px;font-size:20px;cursor:pointer}
.persoonkeuze button:last-child{margin-right:0}
.persoonkeuze .sanne,.persoonkeuze .Sanne{color:var(--sanne-donker);background:linear-gradient(135deg,rgba(182,145,96,.25),rgba(182,145,96,.09));border-color:rgba(184,138,84,.35)}
.persoonkeuze .ramon,.persoonkeuze .Ramon{color:var(--ramon-donker);background:linear-gradient(135deg,rgba(112,145,160,.25),rgba(112,145,160,.09));border-color:rgba(120,149,163,.35)}
.persoonkeuze .Samen{color:#5f5547;background:linear-gradient(135deg,rgba(112,145,160,.22),rgba(182,145,96,.22));border-color:rgba(151,133,108,.4)}
.persoonkeuze button.active{border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor;font-weight:600}
.cijfer-rij{margin:0 0 14px}
.cijfer-rij .wie{font-size:18px;margin:0 0 6px}
.cijfer-rij .wie.Ramon{color:var(--ramon-donker)}.cijfer-rij .wie.Sanne{color:var(--sanne-donker)}
.cijferknoppen{display:grid;grid-template-columns:repeat(10,1fr);grid-gap:5px;gap:5px}
@media(max-width:600px){.cijferknoppen{grid-template-columns:repeat(5,1fr)}}
.cijferknoppen button{min-height:50px;border:1px solid rgba(151,133,108,.45);border-radius:3px;background:#fffdf8;font-family:Caveat,cursive;font-size:30px;line-height:1;cursor:pointer;padding:0}
.cijferknoppen button.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* Bewerken */
.bewerk-blok{margin:0 0 26px}
.ingr-rij{display:grid;grid-template-columns:76px 112px minmax(0,1fr) 42px;grid-gap:6px;gap:6px;align-items:start;padding:10px 0;border-bottom:1px solid rgba(213,205,191,.75)}
.ingr-rij .tekst,.stap-rij .tekst{font-size:17px;padding:8px 9px}
.ingr-rij .extra{grid-column:1 / 5;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;grid-gap:6px;gap:6px;align-items:center}
.ingr-rij .koppeling{grid-column:1 / 5;font-size:14px;font-style:italic;color:#8a7a5f}
.ingr-rij label.mee{font-size:15px;color:#5f5547;white-space:nowrap}
.weg-knop{width:42px;height:42px;border:1px solid rgba(151,133,108,.4);border-radius:50%;background:#fffdf8;color:#8a6845;font-size:22px;line-height:1;cursor:pointer;padding:0}
.stap-rij{display:grid;grid-template-columns:minmax(0,1fr) 42px;grid-gap:6px;gap:6px;padding:10px 0;border-bottom:1px solid rgba(213,205,191,.75)}
.stap-rij .extra{display:grid;grid-template-columns:120px minmax(0,1fr);grid-gap:6px;gap:6px}
.toevoeg-knop{display:block;width:100%;margin:10px 0 0;padding:11px 12px;border:1px dashed rgba(151,133,108,.6);border-radius:3px;background:rgba(255,253,248,.7);color:#6f6253;font-size:18px;text-align:left;cursor:pointer}
.instelling{margin:0 0 20px}
.instelling .label{font-size:18px;margin:0 0 7px}
input[type=range]{width:100%}

/* Hamsa-waaier (zoals bij de gedichten) */
.paraplu{position:fixed;left:50%;bottom:calc(8px + env(safe-area-inset-bottom));z-index:10004;width:56px;height:56px;margin-left:-28px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(151,133,108,.38);border-radius:50%;padding:0;background:rgba(247,244,237,.96);box-shadow:0 2px 10px rgba(55,45,32,.12);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:opacity 500ms cubic-bezier(.4,0,.2,1),visibility 0s,transform 260ms cubic-bezier(.3,1.4,.5,1)}
.paraplu .hand-icon{width:34px;height:40px;transition:transform 300ms cubic-bezier(.3,1.4,.5,1)}
body.fan-open .paraplu{transform:scale(1.06)}
body.fan-open .paraplu .hand-icon{transform:rotate(-8deg) scale(1.05)}
.fan-knop{position:fixed;left:50%;bottom:calc(15px + env(safe-area-inset-bottom));margin-left:-21px;width:42px;height:42px;z-index:10003;display:flex;align-items:center;justify-content:center;border:1px solid rgba(151,133,108,.38);border-radius:50%;padding:0;background:rgba(247,244,237,.97);color:#766b5d;box-shadow:0 2px 9px rgba(55,45,32,.1);cursor:pointer;-webkit-tap-highlight-color:transparent;opacity:0;visibility:hidden;pointer-events:none;transform:translate(0,0) scale(.3);transition:transform 220ms cubic-bezier(.4,0,.2,1),opacity 180ms ease,visibility 0s linear 220ms}
.fan-knop svg{width:21px;height:21px;display:block}
.fan-knop:after{content:attr(data-kort);position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:3px;white-space:nowrap;font-family:Georgia,serif;font-size:11px;color:#7d7264;background:rgba(247,244,237,.92);padding:0 4px;border-radius:6px;pointer-events:none}
.fan-knop.huidig{background:var(--accent);border-color:var(--accent);color:#fff}
body.fan-open .fan-knop{opacity:1;visibility:visible;pointer-events:auto;transform:translate(var(--fx),var(--fy)) scale(1);transition:transform 340ms cubic-bezier(.3,1.35,.5,1) var(--fd),opacity 200ms ease var(--fd),visibility 0s}
.paraplu-scherm{position:fixed;top:0;right:0;bottom:0;left:0;z-index:10002;background:rgba(247,244,237,0);pointer-events:none;transition:background-color 250ms ease}
body.fan-open .paraplu-scherm{background:rgba(247,244,237,.6);pointer-events:auto}
body.controls-idle .paraplu,body.controls-idle .hand{opacity:0;visibility:hidden;pointer-events:none;transition:opacity 500ms cubic-bezier(.4,0,.2,1),visibility 0s linear 500ms}

/* Handjes */
.hand{display:none;position:fixed;z-index:9999;width:60px;height:60px;border:0;background:transparent;padding:0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;cursor:grab;-webkit-appearance:none;appearance:none;filter:drop-shadow(1px 2px 1.5px rgba(40,30,15,.2));transition:opacity 500ms ease}
body.met-handjes .hand{display:block}
.hand svg{width:100%;height:100%;display:block;pointer-events:none;overflow:visible}
.hand.vast{cursor:grabbing;filter:drop-shadow(5px 11px 7px rgba(40,30,15,.24));z-index:10000}
.hand.vast svg{transform:scale(1.1)}
.hand.op-papier{position:absolute}
#handHamsa{left:max(8px,calc((100vw - 900px)/2 + 8px));top:96px}
#handRegel{left:max(8px,calc((100vw - 900px)/2 + 8px));top:156px}
#handWoord{right:max(8px,calc((100vw - 900px)/2 + 8px));top:156px}
#handHamsa svg{transform:rotate(60deg)}
#handRegel svg{transform:rotate(60deg)}
#handWoord svg{transform:rotate(-60deg)}
#handHamsa.vast svg,#handRegel.vast svg{transform:rotate(60deg) scale(1.1)}
#handWoord.vast svg{transform:rotate(-60deg) scale(1.1)}
@media(max-width:600px){.hand{width:44px;height:44px}#handHamsa{top:70px}#handRegel{top:118px;left:4px}#handWoord{top:118px;right:4px}#handHamsa{left:4px}}

/* Hartjes bij samen koken */
.hartje{position:fixed;bottom:-30px;z-index:30000;color:#c2453b;font-size:26px;pointer-events:none;-webkit-animation:stijg 2.8s ease-out forwards;animation:stijg 2.8s ease-out forwards}
@-webkit-keyframes stijg{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-75vh) scale(1.2);opacity:0}}
@keyframes stijg{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-75vh) scale(1.2);opacity:0}}
@media(prefers-reduced-motion:reduce){.hartje{display:none}.ingr,.stap{transition:none}}

const APP_VERSION="1.0.1";
// Plak hier de web-app-URL van het Recepten Apps Script (eindigt op /exec):
const RECEPTEN_URL="https://script.google.com/macros/s/AKfycbxDoDzE2EqPLyzmtx573RPd7PWPYOGITEXFY9zDIcUCjJuRsmNN4Ba7uvyI1Bb1Iz9niA/exec";

const GEDICHTEN_TOKEN="gedichten_access_token";   // gedeeld met de gedichten
const EIGEN_TOKEN="recepten_access_token";        // alleen als de recepten een andere code hebben
const GEDICHTEN_INST="gedichten_instellingen_v1"; // "van wie is dit apparaat" (gedeeld)
const INST_KEY="recepten_instellingen_v1";
const CACHE_KEY="recepten_cache_v1";
const TIMERS_KEY="recepten_timers_v1";
const BLADWIJZER_KEY="recepten_bladwijzers_v1";
const MENSEN=["Sanne","Ramon"];
const KOKS=["Sanne","Ramon","Samen"];
const NIVEAUS=["vol","half","bijna op","op"];
const AFDELINGEN=["Groente & fruit","Brood","Zuivel & eieren","Plantaardig","Kaas","Vlees & vis","Pasta & rijst","Conserven","Wereldkeuken","Sauzen & kruiden","Noten & zaden","Ontbijt","Koffie & thee","Dranken","Diepvries","Huishouden","Overig"];
const EENHEDEN=["","g","kg","ml","l","el","tl","st","teen","takje","bos","blik","pot","pak","zak","snufje","naar smaak"];
const ZONDER_GETAL=["naar smaak"];

/* ---------- Kleine hulpjes ---------- */
const $=id=>document.getElementById(id);
function el(tag,attrs){
const e=document.createElement(tag);
if(attrs)Object.keys(attrs).forEach(k=>{
const v=attrs[k];
if(v===null||v===undefined||v===false)return;
if(k==="class")e.className=v;
else if(k==="text")e.textContent=v;
else if(k.slice(0,2)==="on"&&typeof v==="function")e.addEventListener(k.slice(2),v);
else e.setAttribute(k,v===true?"":v);
});
for(let n=2;n<arguments.length;n++)voegKind(e,arguments[n]);
return e;
}
function voegKind(e,c){
if(c===null||c===undefined||c===false)return;
if(Array.isArray(c)){c.forEach(x=>voegKind(e,x));return}
e.appendChild(typeof c==="object"?c:document.createTextNode(String(c)));
}
function leesJSON(k,d){try{const v=JSON.parse(localStorage.getItem(k)||"null");return v===null?d:v}catch(e){return d}}
function bewaarJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function nieuwId(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
const wacht=ms=>new Promise(r=>setTimeout(r,ms));
function ornament(){return el("div",{class:"ornament","aria-hidden":"true"},el("span",{class:"l"}),el("i"),el("span",{class:"r"}))}
function getal(n){
if(n===null||n===undefined||n===""||isNaN(n))return "";
n=Number(n);
const heel=Math.floor(n+1e-9),rest=Math.round((n-heel)*100)/100;
const breuk={0.25:"¼",0.5:"½",0.75:"¾"}[rest];
if(breuk)return(heel?heel:"")+breuk;
if(rest===0)return String(heel);
return String(Math.round(n*10)/10).replace(".",",");
}
function melding(tekst,actieLabel,actie,duur){
document.querySelectorAll(".melding").forEach(m=>m.remove());
const m=el("div",{class:"melding",role:"status"},el("span",{text:tekst}));
if(actieLabel)m.appendChild(el("button",{type:"button",onclick:()=>{m.remove();actie()}},actieLabel));
document.body.appendChild(m);
setTimeout(()=>m.remove(),duur||6000);
}
window.addEventListener("error",e=>{if(e&&e.message)melding("Er ging iets mis: "+e.message)});

/* ---------- Datums ---------- */
function datumStr(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function vandaag(){return datumStr(new Date())}
function alsDatum(s){const p=String(s).split("-").map(Number);return new Date(p[0],p[1]-1,p[2])}
function plusDagen(s,n){const d=alsDatum(s);d.setDate(d.getDate()+n);return datumStr(d)}
function hoofdletter(t){return t.charAt(0).toUpperCase()+t.slice(1)}
function dagNaam(s){
const v=vandaag();
if(s===v)return "Vandaag";
if(s===plusDagen(v,1))return "Morgen";
if(s===plusDagen(v,-1))return "Gisteren";
return hoofdletter(alsDatum(s).toLocaleDateString("nl-NL",{weekday:"long"}));
}
function korteDatum(s){return alsDatum(s).toLocaleDateString("nl-NL",{day:"numeric",month:"short"})}
function langeDatum(d){return d.toLocaleDateString("nl-NL",{weekday:"long",day:"numeric",month:"long"})}
function leesTijd(t){const m=String(t||"").match(/^(\d{2})-(\d{2})-(\d{4})(?: (\d{2}):(\d{2}))?/);return m?new Date(+m[3],+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0)):null}

/* ---------- Instellingen ---------- */
const inst=Object.assign({schaal:1,idle:60,handjes:true},leesJSON(INST_KEY,{}));
function bewaarInst(){bewaarJSON(INST_KEY,inst)}
function eigenaar(){const g=leesJSON(GEDICHTEN_INST,{});return MENSEN.indexOf(g.owner)!==-1?g.owner:""}
function zetEigenaar(v){const g=leesJSON(GEDICHTEN_INST,{});g.owner=v;bewaarJSON(GEDICHTEN_INST,g)}
function token(){return localStorage.getItem(EIGEN_TOKEN)||localStorage.getItem(GEDICHTEN_TOKEN)||""}
function pasSchaalToe(){document.documentElement.style.setProperty("--schaal",String(inst.schaal||1))}
pasSchaalToe();

/* ---------- Gegevens ---------- */
let D={recepten:[],ingredienten:[],stappen:[],weekmenu:[],boodschappen:[],producten:[],cijfers:[],onderweg:null};
const IX={recept:{},ingr:{},stap:{},product:{}};
function indexeer(){
IX.recept={};IX.ingr={};IX.stap={};IX.product={};
D.recepten.forEach(r=>{IX.recept[r.id]=r});
D.ingredienten.forEach(i=>{(IX.ingr[i.receptId]=IX.ingr[i.receptId]||[]).push(i)});
D.stappen.forEach(s=>{(IX.stap[s.receptId]=IX.stap[s.receptId]||[]).push(s)});
Object.keys(IX.ingr).forEach(k=>IX.ingr[k].sort((a,b)=>Number(a.volgorde)-Number(b.volgorde)));
Object.keys(IX.stap).forEach(k=>IX.stap[k].sort((a,b)=>Number(a.nr)-Number(b.nr)));
D.producten.forEach(p=>{IX.product[p.id]=p});
}
function ingesteld(){return /^https:\/\/script\.google(usercontent)?\.com\//.test(RECEPTEN_URL)}

function jsonp(params){
return new Promise((resolve,reject)=>{
const naam="receptCb"+Date.now()+Math.floor(Math.random()*1e5);
const s=document.createElement("script");
const url=new URL(RECEPTEN_URL);
Object.keys(params).forEach(k=>url.searchParams.set(k,params[k]));
url.searchParams.set("token",token());
url.searchParams.set("callback",naam);
let klaar=false;
const timer=setTimeout(()=>{op();reject(new Error("Time-out"))},20000);
function op(){if(klaar)return;klaar=true;clearTimeout(timer);delete window[naam];if(s.parentNode)s.parentNode.removeChild(s)}
window[naam]=d=>{op();if(!d||!d.success){reject(new Error((d&&d.error)||"Ongeldig antwoord"));return}resolve(d)};
s.onerror=()=>{op();reject(new Error("Geen verbinding met Google"))};
s.src=url.toString();
document.head.appendChild(s);
});
}
async function post(velden){
const f=new URLSearchParams();
f.append("token",token());
Object.keys(velden).forEach(k=>{const v=velden[k];f.append(k,typeof v==="object"?JSON.stringify(v):String(v===undefined||v===null?"":v))});
await fetch(RECEPTEN_URL,{method:"POST",mode:"no-cors",body:f});
}
// Na opslaan: even later opnieuw ophalen, zodat alle apparaten weer hetzelfde zien.
let naladenTimer=null;
function straksLaden(ms){clearTimeout(naladenTimer);naladenTimer=setTimeout(()=>laad(),ms||1600)}

let laatsteLaad=0,wachtRender=false;
async function laad(){
if(!ingesteld())return;

/* ---------- Schalen en omrekenen ---------- */
const HELE_DINGEN=/(^|\s)(ei|eieren|ui|uien|limoen|limoenen|citroen|citroenen|paprika|paprika's|sjalot|sjalotten|avocado|avocado's)(\s|$)/i;
function basisPersonen(r){return Number(r&&r.personen)||2}
const gekozenPersonen={};
function personenVoor(id){return gekozenPersonen[id]||basisPersonen(IX.recept[id])}
function factorVoor(id){return personenVoor(id)/basisPersonen(IX.recept[id])}
function schaal(i,f){
const ruw=Number(String(i.hoeveelheid).replace(",","."));
if(i.hoeveelheid===""||isNaN(ruw))return{h:null,e:i.eenheid,ben:false};
if(i.schalen==="nee"||f===1)return{h:ruw,e:i.eenheid,ben:false};
let h=ruw*f,e=i.eenheid;
if(e==="kg"&&h<1){h*=1000;e="g"}else if(e==="g"&&h>=1000){h/=1000;e="kg"}
if(e==="l"&&h<1){h*=1000;e="ml"}else if(e==="ml"&&h>=1000){h/=1000;e="l"}
const voor=h;
if(e==="g"||e==="ml")h=h<10?Math.max(1,Math.round(h)):h<100?Math.round(h/5)*5:h<500?Math.round(h/10)*10:Math.round(h/25)*25;
else if(e==="kg"||e==="l")h=Math.round(h*10)/10;
else if(e==="el"||e==="tl")h=Math.max(.25,Math.round(h*4)/4);
else if(e==="teen"||((e==="st"||e==="")&&HELE_DINGEN.test(i.naam)))h=Math.max(1,Math.round(h));
else h=Math.max(.5,Math.round(h*2)/2);
const ben=(e==="teen"||e==="st"||e==="")&&Math.abs(h-voor)>.05;
return{h,e,ben};
}
const MEERVOUD={teen:"tenen",takje:"takjes",blik:"blikken",blikje:"blikjes",pot:"potten",pak:"pakken",zak:"zakken",bos:"bossen",fles:"flessen",flesje:"flesjes",snufje:"snufjes",stuk:"stuks"};
function meervoud(e,h){return Number(h)>1&&MEERVOUD[e]?MEERVOUD[e]:e}
function hoeveelheidTekst(s,eenheid){
if(eenheid==="naar smaak")return "";
if(s.h===null)return eenheid||"";
return (s.ben?"≈ ":"")+getal(s.h)+(s.e&&s.e!=="st"?" "+meervoud(s.e,s.h):"");
}
// Hoeveel verpakkingen van een product gebruikt een ingrediënt? (0,15 = een stukje van de zak)
const LEPEL={el:15,tl:5};
function deelVan(i,f,p){
if(!p||p.soort==="niveau")return 0;
const ruw=Number(String(i.hoeveelheid).replace(",","."));
if(i.hoeveelheid===""||isNaN(ruw))return .25;
const h=ruw*(i.schalen==="nee"?1:f);
const inhoud=Number(p.inhoud)||0;
if(i.eenheid===p.verpakking||((i.eenheid==="st"||i.eenheid==="")&&!inhoud))return h;
let w=null,soort="";
if(i.eenheid==="g"||i.eenheid==="ml"){w=h;soort=i.eenheid}
else if(i.eenheid==="kg"||i.eenheid==="l"){w=h*1000;soort=i.eenheid==="kg"?"g":"ml"}
else if(LEPEL[i.eenheid]){w=h*LEPEL[i.eenheid];soort="?"}
if(w!==null&&inhoud&&(soort===p.eenheid||soort==="?"))return w/inhoud;
return .25;
}

if(!w.receptId||w.gekookt||w.datum<v||(behalve&&behalve.indexOf(w.id)!==-1))return;

const f=(Number(w.personen)||basisPersonen(r))/basisPersonen(r);

}

let timers=leesJSON(TIMERS_KEY,[]),geluid=null,laatstePiep=0;
function ontgrendelGeluid(){
try{
if(!geluid){const AC=window.AudioContext||window.webkitAudioContext;if(AC)geluid=new AC()}
if(!geluid)return;
if(geluid.state==="suspended")geluid.resume();
const o=geluid.createOscillator(),g=geluid.createGain();g.gain.value=0.0001;o.connect(g);g.connect(geluid.destination);o.start();o.stop(geluid.currentTime+0.05);
}catch(e){}
}
document.addEventListener("pointerdown",function eersteTik(){ontgrendelGeluid();document.removeEventListener("pointerdown",eersteTik)},true);
function piep(){
if(!geluid)return;
try{[0,.35,.7].forEach(t=>{const o=geluid.createOscillator(),g=geluid.createGain(),s=geluid.currentTime+t;o.frequency.value=880;g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(0.4,s+0.02);g.gain.exponentialRampToValueAtTime(0.0001,s+0.3);o.connect(g);g.connect(geluid.destination);o.start(s);o.stop(s+0.32)})}catch(e){}
}

s.innerHTML="";
s.hidden=!timers.length;
timers.forEach(t=>{
const rest=Math.max(0,Math.round((t.eind-Date.now())/1000));
const tijd=Math.floor(rest/60)+":"+String(rest%60).padStart(2,"0");
s.appendChild(el("button",{type:"button",class:"timer"+(t.klaar?" klaar":""),onclick:()=>timerKnop(t)},t.label+" · "+(t.klaar?"klaar!":tijd)));
});
}
function timerKnop(t){
if(t.klaar){timers=timers.filter(x=>x!==t);bewaarJSON(TIMERS_KEY,timers);tekenTimers();return}
const m=modal(t.label,null,[
["Stoppen",()=>{timers=timers.filter(x=>x!==t);bewaarJSON(TIMERS_KEY,timers);tekenTimers();m.sluit()}],
["+1 min",()=>{t.eind+=60000;bewaarJSON(TIMERS_KEY,timers);tekenTimers();m.sluit()}],
["Laten lopen",()=>m.sluit(),"hoofd"]]);
}
setInterval(()=>{
if(!timers.length)return;
const nu=Date.now();let veranderd=false;
timers.forEach(t=>{if(!t.klaar&&nu>=t.eind){t.klaar=true;veranderd=true}});
if(veranderd)bewaarJSON(TIMERS_KEY,timers);
if(timers.some(t=>t.klaar)&&nu-laatstePiep>4000){piep();laatstePiep=nu}
tekenTimers();
},1000);

/* ---------- Op de boodschappenlijst ---------- */
// bronnen: [{receptId, f, weekId?}]. Rekent met de kast en met wat al gepland is.
function lijstDialoog(bronnen,opties){
opties=opties||{};
const res=reserveringen(bronnen.map(b=>b.weekId).filter(Boolean));
const prod={},vers={};
bronnen.forEach(b=>{
(IX.ingr[b.receptId]||[]).forEach(i=>{
const p=IX.product[i.productId];
if(p){const x=prod[p.id]=prod[p.id]||{p:p,som:0,receptId:b.receptId};x.som+=deelVan(i,b.f,p);return}
const s=schaal(i,b.f);
const k=i.naam.toLowerCase()+"|"+(s.e||"");
const x=vers[k]=vers[k]||{naam:i.naam,e:s.e,h:0,leeg:s.h===null,eenheid:i.eenheid,afdeling:i.afdeling||raadAfdeling(i.naam),winkel:i.winkel,receptId:b.receptId};
if(s.h!==null)x.h+=s.h;
});
});
const opLijst=(pid,naam)=>D.boodschappen.find(b=>b.status==="open"&&(pid?b.productId===pid:b.naam.toLowerCase()===naam.toLowerCase()));
const rijen=[];
Object.keys(prod).forEach(k=>{
const x=prod[k],p=x.p;
let aan,aantal,tekst,noot;
if(p.soort==="niveau"){aan=p.niveau==="op";aantal=1;tekst=p.naam;noot="in de kast: "+(p.niveau||"?")}
else{
const nodig=Math.max(1,Math.ceil(x.som-1e-9));
const vrij=Math.max(0,(Number(p.aantal)||0)-(res[p.id]?res[p.id].aantal:0));
const tekort=Math.max(0,nodig-vrij);
aan=tekort>0;aantal=tekort||nodig;
tekst=aantal+" "+meervoud(p.verpakking,aantal)+" "+p.naam;
noot=(Number(p.aantal)||0)+" in de kast"+(res[p.id]?", "+res[p.id].aantal+" al gepland":"")+(aan?"":": genoeg");
}
if(opLijst(p.id)){aan=false;noot+=" · staat al op de lijst"}
rijen.push({aan:aan,tekst:tekst,noot:noot,item:{naam:p.naam,hoeveelheid:aantal,eenheid:p.verpakking,winkel:p.winkel||"Lidl",afdeling:p.afdeling,productId:p.id,receptId:x.receptId}});
});

function verschillen(oud,nieuw){

[["titel","Titel"],["personen","Personen"],["tijd","Tijd"],["tags","Tags"],["bron","Bron"],["letop","Let op"]].forEach(([k,l])=>{if(oud[k]!==nieuw[k])uit.push(l+": "+(oud[k]||"(leeg)")+" → "+(nieuw[k]||"(leeg)"))});
const besch=i=>[i.hoeveelheid,i.eenheid].filter(Boolean).join(" ")+(i.notitie?", "+i.notitie:"");
const oudI={},nieuwI={};oud.ingredienten.forEach(i=>{oudI[i.naam.toLowerCase()]=i});nieuw.ingredienten.forEach(i=>{nieuwI[i.naam.toLowerCase()]=i});
Object.keys(nieuwI).forEach(k=>{const n=nieuwI[k],o=oudI[k];if(!o)uit.push("Nieuw ingrediënt: "+n.naam+" ("+besch(n)+")");else if(besch(o)!==besch(n)||o.schalen!==n.schalen||o.groep!==n.groep)uit.push(n.naam+": "+besch(o)+" → "+besch(n))});
Object.keys(oudI).forEach(k=>{if(!nieuwI[k])uit.push("Weg: "+oudI[k].naam)});
const max=Math.max(oud.stappen.length,nieuw.stappen.length);
for(let k=0;k<max;k++){const o=oud.stappen[k],n=nieuw.stappen[k];if(!o)uit.push("Stap "+(k+1)+" toegevoegd");else if(!n)uit.push("Stap "+(k+1)+" weggehaald");else if(JSON.stringify(o)!==JSON.stringify(n))uit.push("Stap "+(k+1)+" aangepast")}

}

const HANDEN=[{id:"handHamsa",soort:"hamsa",label:"Hamsa-hand: sleep over een stap om hem te vergroten"},{id:"handRegel",soort:"regel",label:"Wijzende vinger: leg hem bij een stap als bladwijzer"},{id:"handWoord",soort:"woord",label:"Wijzende vinger: wijs een ingrediënt aan"}];

let bel=null;
function handMidden(h){const r=h.el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2,w:r.width,h:r.height}}
function handPak(h,e){
if(e.button!==undefined&&e.button!==0)return;
e.preventDefault();
const c=handMidden(h);
h.sleep={sx:e.clientX,sy:e.clientY,dx:e.clientX-c.x,dy:e.clientY-c.y,bewogen:false};
// Los van het papier: weer vast op het scherm, op dezelfde plek.
h.el.classList.remove("op-papier");
h.el.style.transition="none";h.el.style.transform="";
zetHandScherm(h,c.x,c.y);
h.el.classList.add("vast");
try{h.el.setPointerCapture(e.pointerId)}catch(x){}
}
function zetHandScherm(h,x,y){const w=h.el.offsetWidth,hh=h.el.offsetHeight;h.el.style.left=(x-w/2)+"px";h.el.style.top=(y-hh/2)+"px";h.el.style.right="auto"}
function handBeweeg(h,e){
if(!h.sleep)return;
e.preventDefault();
if(!h.sleep.bewogen&&Math.hypot(e.clientX-h.sleep.sx,e.clientY-h.sleep.sy)>8)h.sleep.bewogen=true;
if(!h.sleep.bewogen)return;
zetHandScherm(h,e.clientX-h.sleep.dx,e.clientY-h.sleep.dy);
richtHand(h);
}
function handLos(h,e){
if(!h.sleep)return;
const s=h.sleep;h.sleep=null;
h.el.classList.remove("vast");
if(!s.bewogen){if(h.op)handNaarHuis(h,true);else{h.el.style.left="";h.el.style.top="";h.el.style.right="";melding(h.label+".")}return}
const c=handMidden(h);
const thuis=handThuis(h);
if(Math.hypot(c.x-thuis.x,c.y-thuis.y)<90){handNaarHuis(h,true);return}
legHandNeer(h,c.x+window.scrollX,c.y+window.scrollY);
}
// Neergelegd: vast aan het papier, scrollt mee.
function legHandNeer(h,docX,docY){
const w=h.el.offsetWidth,hh=h.el.offsetHeight;
h.el.classList.add("op-papier");
h.el.style.left=(docX-w/2)+"px";h.el.style.top=(docY-hh/2)+"px";h.el.style.right="auto";
h.op=true;
richtHand(h);
if(h.soort==="regel"){
const bw=leesJSON(BLADWIJZER_KEY,{});
const id=route().a;
if(h.doel){bw[id]=h.doel.dataset.nr;document.querySelectorAll(".stap.bladwijzer").forEach(x=>x.classList.remove("bladwijzer"));h.doel.classList.add("bladwijzer")}
else delete bw[id];
bewaarJSON(BLADWIJZER_KEY,bw);
}
}
function handThuis(h){
const st={l:h.el.style.left,t:h.el.style.top,r:h.el.style.right,o:h.el.classList.contains("op-papier")};
h.el.classList.remove("op-papier");h.el.style.left="";h.el.style.top="";h.el.style.right="";
const c=handMidden(h);
if(st.o)h.el.classList.add("op-papier");
h.el.style.left=st.l;h.el.style.top=st.t;h.el.style.right=st.r;
return c;
}
function handNaarHuis(h,animeer){
if(h===true||h===false){HANDEN.forEach(x=>handNaarHuis(x,h));return}
const van=handMidden(h);
if(h.doel){h.doel.classList.remove("vergroot","aangewezen");h.doel=null}
if(h.soort==="woord"&&bel){bel.remove();bel=null}
if(h.soort==="regel"&&h.op){const bw=leesJSON(BLADWIJZER_KEY,{});delete bw[route().a];bewaarJSON(BLADWIJZER_KEY,bw);document.querySelectorAll(".stap.bladwijzer").forEach(x=>x.classList.remove("bladwijzer"))}
h.op=false;
h.el.classList.remove("op-papier","vast");
h.el.style.left="";h.el.style.top="";h.el.style.right="";
if(!animeer||!h.el.offsetWidth){h.el.style.transition="";h.el.style.transform="";return}
const naar=handMidden(h);
h.el.style.transition="none";
h.el.style.transform="translate("+(van.x-naar.x)+"px,"+(van.y-naar.y)+"px)";
void h.el.offsetWidth;
h.el.style.transition="transform 520ms cubic-bezier(.3,1.25,.5,1)";
h.el.style.transform="";
}
// Wat wijst het handje aan?
function richtHand(h){
const c=handMidden(h);
let x=c.x,y=c.y;
if(h.soort==="regel"){x+=c.w*.4;y-=c.h*.21}
if(h.soort==="woord"){x-=c.w*.4;y-=c.h*.21}
let doel=null;
const stapel=document.elementsFromPoint?document.elementsFromPoint(x,y):[];
for(let k=0;k<stapel.length;k++){
const n=stapel[k];
if(n.closest&&n.closest(".hand"))continue;
const z=n.closest&&n.closest(h.soort==="hamsa"?".stap,.ingr":h.soort==="regel"?".stap":".ingr");
if(z){doel=z;break}
}
if(doel!==h.doel){
if(h.doel)h.doel.classList.remove("vergroot","aangewezen");
h.doel=doel;
if(doel)doel.classList.add(h.soort==="hamsa"?"vergroot":"aangewezen");
}
if(h.soort==="woord"){
if(bel){bel.remove();bel=null}
if(doel&&doel.dataset.bel){
const r=doel.getBoundingClientRect();
bel=el("div",{class:"bel",text:doel.dataset.bel});
document.body.appendChild(bel);
bel.style.left=Math.max(8,Math.min(window.innerWidth-bel.offsetWidth-8,r.left+window.scrollX))+"px";
bel.style.top=(r.top+window.scrollY-bel.offsetHeight-8)+"px";
}
}
}
function handjesNaRender(r){
const sleutel=r.v+"/"+r.a;
if(sleutel!==vorigeRoute||r.v!=="recept"){
HANDEN.forEach(h=>handNaarHuis(h,false));
if(r.v==="recept"&&inst.handjes!==false){
const nr=leesJSON(BLADWIJZER_KEY,{})[r.a];
if(nr)requestAnimationFrame(()=>{
const stap=document.querySelector('.stap[data-nr="'+nr+'"]');
const h=HANDEN[1];
if(!stap||!h.el.offsetWidth)return;
const s=stap.getBoundingClientRect();
legHandNeer(h,s.left+window.scrollX+4,s.top+window.scrollY+h.el.offsetHeight*.55);
});
}
return;
}
// Zelfde recept opnieuw getekend: neergelegde handjes kijken opnieuw wat ze aanwijzen.
requestAnimationFrame(()=>HANDEN.forEach(h=>{if(h.op){h.doel=null;richtHand(h)}}));
}

/* ======================================================================
   Vervagen, bijwerken, starten
   ====================================================================== */
let idleTimer=null,slikTot=0;
function herstartIdle(){clearTimeout(idleTimer);if(inst.idle>0)idleTimer=setTimeout(()=>{if(route().v==="koken"||modalOpen||document.body.classList.contains("fan-open")){herstartIdle();return}document.body.classList.add("controls-idle")},inst.idle*1000)}
document.addEventListener("pointerdown",e=>{
if(document.body.classList.contains("controls-idle")){
document.body.classList.remove("controls-idle");
if(e.target.closest&&e.target.closest(".paraplu,.hand")){e.preventDefault();e.stopPropagation();slikTot=Date.now()+700}
}
herstartIdle();
},true);
document.addEventListener("click",e=>{if(Date.now()<slikTot){e.preventDefault();e.stopPropagation();slikTot=0}},true);
herstartIdle();

// Nieuwe versie op GitHub? Dan vanzelf herladen, maar nooit midden in iets.
let herladenNodig=false;
async function controleerVersie(){
if(location.protocol!=="https:")return;
try{
const r=await fetch("index.html?versie="+Date.now(),{cache:"no-store"});
if(!r.ok)return;
const m=(await r.text()).match(/const APP_VERSION="([^"]+)"/);
if(m&&m[1]!==APP_VERSION)herladenNodig=true;
}catch(e){}
}
// Eén hartslag: verversen (vaker als iemand onderweg is) en zo nodig herladen.
setInterval(()=>{
if(document.visibilityState==="hidden")return;
const snel=actiefOnderweg()||route().v==="lijst";
if(Date.now()-laatsteLaad>(snel?20000:60000))laad();
if(herladenNodig&&!bezig()&&route().v!=="koken")location.reload();
},5000);
setInterval(controleerVersie,30*60000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&Date.now()-laatsteLaad>15000)laad()});
window.addEventListener("online",()=>laad());

if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("../sw.js").catch(()=>{})}

(function start(){
if(/[?&]kast\b/.test(location.search)&&!location.hash)history.replaceState(null,"",location.pathname+location.search+"#kast");
const c=leesJSON(CACHE_KEY,null);
if(c&&c.data){D=c.data;indexeer()}
tekenTimers();
render();
laad();
controleerVersie();
})();
</script>
