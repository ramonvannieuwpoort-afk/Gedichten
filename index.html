
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>Gedichten</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
* { box-sizing: border-box; }

html { background: #fff; }

body {
    margin: 0;
    background: #eee9df;
    color: #302c26;
    font-family: 'Cormorant Garamond', Georgia, serif;
}

.page {
    max-width: 900px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 105px 65px 65px;
    background: linear-gradient(
        to bottom,
        #fff 0px,
        #fff 25px,
        #f7f4ed 85px,
        #eee9df 210px
    );
}

header {
    position: relative;
    text-align: center;
    margin-bottom: 58px;
    padding-bottom: 25px;
    border-bottom: 1px solid #d5cdbf;
}

h1 {
    font-size: 43px;
    font-weight: 500;
    line-height: 1.1;
    margin: 0 0 8px;
}

.author {
    font-size: 21px;
    font-style: italic;
    color: #887e70;
}

.poem {
    font-size: 25px;
    line-height: 1.48;
    text-align: left;
    overflow-wrap: break-word;
}

.poem-paragraph {
    position: relative;
    margin: 0 0 1.15em;
    font-size: inherit;
    font-weight: 400;
    line-height: inherit;
    color: #302c26;
    transform: scale(1);
    transform-origin: left center;
    transition:
        transform 420ms cubic-bezier(0.22, 1, 0.36, 1),
        font-weight 350ms ease,
        color 400ms ease,
        text-shadow 400ms ease;
    will-change: transform;
}

.poem-paragraph.active {
    transform: scale(1.09);
    font-weight: 600;
    color: #211b14;
    text-shadow: 0 0 0.01px #211b14;
    z-index: 2;
}

.navigation {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 70px;
    padding-top: 20px;
    border-top: 1px solid #d5cdbf;
}

button { font-family: inherit; }

.nav-button {
    border: 0;
    background: none;
    color: #887e70;
    font-size: 20px;
    cursor: pointer;
    padding: 8px 0;
}

.nav-button:active { color: #302c26; }

.counter {
    font-size: 17px;
    color: #887e70;
}

/* Twee compacte handjes in de zijmarges */

.hand {
    position: fixed;
    z-index: 9999;
    top: 105px;
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid #b9a98e;
    border-radius: 50%;
    background: #fffdf8;
    box-shadow:
        0 2px 8px rgba(50, 40, 25, 0.12),
        inset 0 0 0 2px rgba(255,255,255,0.9);
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-appearance: none;
    appearance: none;
    padding: 0;
    transition:
        width 180ms ease,
        height 180ms ease,
        box-shadow 180ms ease,
        background 180ms ease;
}

#hand1 {
    left: max(8px, calc((100vw - 900px) / 2 + 8px));
}

#hand2 {
    right: max(8px, calc((100vw - 900px) / 2 + 8px));
}

/* SVG-kleurenring: geen CSS-maskers of gradients */

.hand-ring {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 0;
    pointer-events: none;
}

.hand::before,
.hand::after {
    content: none;
}

.hand.dragging {
    width: 46px;
    height: 46px;
    cursor: grabbing;
    background: #fffdf9;
    box-shadow: 0 4px 15px rgba(50,40,25,0.16);
}

.hand-icon {
    position: relative;
    z-index: 2;
    width: 30px;
    height: 30px;
    display: block;
    overflow: visible;
    pointer-events: none;
}

.hand.dragging .hand-icon {
    width: 33px;
    height: 33px;
}

.hand-hint {
    margin-top: 18px;
    font-size: 15px;
    color: #a09688;
    text-align: center;
    font-style: italic;
}

@media (max-width: 600px) {
    .page {
        padding: 75px 27px 50px;
        background: linear-gradient(
            to bottom,
            #fff 0px,
            #fff 20px,
            #f7f4ed 65px,
            #eee9df 175px
        );
    }

    h1 { font-size: 36px; }
    .author { font-size: 20px; }

    .poem {
        font-size: 22px;
        line-height: 1.45;
    }

    header { margin-bottom: 48px; }
    .navigation { margin-top: 55px; }

    #hand1 {
        top: 76px;
        left: 3px;
    }

    #hand2 {
        top: 76px;
        right: 3px;
    }

    .hand {
        width: 34px;
        height: 34px;
    }

    .hand.dragging {
        width: 38px;
        height: 38px;
    }

    .hand-icon {
        width: 25px;
        height: 25px;
    }

    .hand.dragging .hand-icon {
        width: 28px;
        height: 28px;
    }

    .poem-paragraph.active {
        transform: scale(1.07);
    }
}

@media (prefers-reduced-motion: reduce) {
    .poem-paragraph,
    .hand,
    .hand-icon {
        transition: none !important;
    }
}
</style>
</head>

<body>

<div class="page">

    <header>
        <h1 id="title">Gedichten</h1>
        <div class="author" id="author"></div>
    </header>

    <main>
        <div class="poem" id="poem"></div>
        <div class="hand-hint">
            Sleep de handjes over het gedicht om twee passages te vergroten
        </div>
    </main>

    <div class="navigation">
        <button class="nav-button" id="previous">← Vorige</button>
        <div class="counter" id="counter"></div>
        <button class="nav-button" id="next">Volgende →</button>
    </div>

</div>

<!-- Eerste hand -->
<button type="button" class="hand" id="hand1"
        aria-label="Eerste vergroothand">
    <svg class="hand-icon" viewBox="0 0 64 64"
         xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g transform="rotate(-25 32 32)"
           fill="none" stroke="#72543c"
           stroke-linecap="round" stroke-linejoin="round">
            <path d="M27 48 C25 46 23 44 21 42 L13 34
                C11 32 11 29 13 27 C15 25 18 25 20 27
                L27 33 L27 13 C27 10 29 8 32 8
                C35 8 37 10 37 13 L37 29 L42 25
                C44 23 47 24 48 26 C50 28 49 31 47 33
                L42 39 L40 46 C39 49 36 52 32 52
                L29 52 C28 52 27 50 27 48 Z"
                stroke-width="1.8"/>
            <path d="M27 37 C30 35 34 35 38 37" stroke-width="1.1"/>
            <path d="M29 43 C31 40 35 40 37 43 C35 46 31 46 29 43 Z"
                  stroke-width="1.1"/>
            <circle cx="33" cy="43" r="1.2" fill="#c94b36" stroke="none"/>
            <path d="M32 18 L32 22 M30 20 L34 20" stroke-width="1"/>
            <path d="M24 38 L21 35 M40 32 L44 29" stroke-width="1"/>
            <circle cx="24" cy="46" r="0.8" fill="#278b91" stroke="none"/>
            <circle cx="40" cy="45" r="0.8" fill="#278b91" stroke="none"/>
        </g>
    </svg>
</button>

<!-- Tweede hand -->
<button type="button" class="hand" id="hand2"
        aria-label="Tweede vergroothand">
    <svg class="hand-icon" viewBox="0 0 64 64"
         xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g transform="rotate(-25 32 32)"
           fill="none" stroke="#72543c"
           stroke-linecap="round" stroke-linejoin="round">
            <path d="M27 48 C25 46 23 44 21 42 L13 34
                C11 32 11 29 13 27 C15 25 18 25 20 27
                L27 33 L27 13 C27 10 29 8 32 8
                C35 8 37 10 37 13 L37 29 L42 25
                C44 23 47 24 48 26 C50 28 49 31 47 33
                L42 39 L40 46 C39 49 36 52 32 52
                L29 52 C28 52 27 50 27 48 Z"
                stroke-width="1.8"/>
            <path d="M27 37 C30 35 34 35 38 37" stroke-width="1.1"/>
            <path d="M29 43 C31 40 35 40 37 43 C35 46 31 46 29 43 Z"
                  stroke-width="1.1"/>
            <circle cx="33" cy="43" r="1.2" fill="#c94b36" stroke="none"/>
            <path d="M32 18 L32 22 M30 20 L34 20" stroke-width="1"/>
            <path d="M24 38 L21 35 M40 32 L44 29" stroke-width="1"/>
            <circle cx="24" cy="46" r="0.8" fill="#278b91" stroke="none"/>
            <circle cx="40" cy="45" r="0.8" fill="#278b91" stroke="none"/>
        </g>
    </svg>
</button>

<script>
/* De Andes-geïnspireerde ring wordt volledig met SVG getekend.
   Eerst de gouden basis en het witte midden, daarna de versieringen.
   Daardoor blijven alle gekleurde vormen zichtbaar op de buitenrand. */

function createAndeanRing() {
    const ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns, "svg");

    svg.setAttribute("viewBox", "0 0 64 64");
    svg.setAttribute("class", "hand-ring");
    svg.setAttribute("aria-hidden", "true");

    function add(tag, attributes, parent = svg) {
        const element = document.createElementNS(ns, tag);
        Object.keys(attributes).forEach(key => {
            element.setAttribute(key, attributes[key]);
        });
        parent.appendChild(element);
        return element;
    }

    const colors = [
        "#bd4938",
        "#d87937",
        "#e5b84e",
        "#829b55",
        "#278b91",
        "#315b96",
        "#73558a",
        "#c15a42",
        "#d99a43",
        "#6f925b",
        "#287f86",
        "#66518a",
        "#bd4938",
        "#d87937",
        "#e5b84e",
        "#829b55"
    ];

    /* Gouden basisring */
    add("circle", {
        cx: 32, cy: 32, r: 29,
        fill: "#d5a64c"
    });

    /* Buitenste fijne donkere lijn */
    add("circle", {
        cx: 32, cy: 32, r: 30.5,
        fill: "none",
        stroke: "#72543c",
        "stroke-width": 0.65
    });

    /* Wit midden: laat de versieringen aan de buitenkant vrij */
    add("circle", {
        cx: 32, cy: 32, r: 22.5,
        fill: "#fffdf8"
    });

    /* Fijne binnenste rand */
    add("circle", {
        cx: 32, cy: 32, r: 22.5,
        fill: "none",
        stroke: "#a77b45",
        "stroke-width": 0.8
    });

    /* Tweede dunne lijn aan de buitenzijde */
    add("circle", {
        cx: 32, cy: 32, r: 26.5,
        fill: "none",
        stroke: "#fff1d2",
        "stroke-width": 0.65
    });

    /* Zestien kleine geweven ruitmotieven */
    for (let i = 0; i < 16; i++) {
        const angle = i * 22.5;
        const group = add("g", {
            transform: `rotate(${angle} 32 32)`
        });

        /* Grote gekleurde ruit */
        add("path", {
            d: "M32 23.1 L35.2 27 L32 30.9 L28.8 27 Z",
            fill: colors[i],
            stroke: "#fff4dc",
            "stroke-width": 0.8,
            "stroke-linejoin": "round"
        }, group);

        /* Binnenruit */
        add("path", {
            d: "M32 24.8 L33.7 27 L32 29.2 L30.3 27 Z",
            fill: "none",
            stroke: "#72543c",
            "stroke-width": 0.55
        }, group);

        /* Klein kleuraccent buiten de ruit */
        add("circle", {
            cx: 32,
            cy: 7.2,
            r: 1.15,
            fill: colors[i],
            stroke: "#fff4dc",
            "stroke-width": 0.5
        }, group);

        /* Klein driehoekig accent */
        add("path", {
            d: "M32 10.2 L33.1 12.1 L30.9 12.1 Z",
            fill: i % 2 === 0 ? "#72543c" : "#fff4dc",
            stroke: "none"
        }, group);
    }

    /* Kleine stippen tussen de motieven */
    for (let i = 0; i < 16; i++) {
        const angle = (i * 22.5 + 11.25) * Math.PI / 180;
        const x = 32 + Math.sin(angle) * 27.7;
        const y = 32 - Math.cos(angle) * 27.7;

        add("circle", {
            cx: x.toFixed(2),
            cy: y.toFixed(2),
            r: 0.75,
            fill: "#fff4dc",
            stroke: "#72543c",
            "stroke-width": 0.35
        });
    }

    /* Subtiele buitenrand */
    add("circle", {
        cx: 32, cy: 32, r: 31.1,
        fill: "none",
        stroke: "#fff8e9",
        "stroke-width": 0.7
    });

    return svg;
}

/* Plaats dezelfde ring onder beide handjes */
document.querySelectorAll(".hand").forEach(hand => {
    hand.insertBefore(createAndeanRing(), hand.firstChild);
});


const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSyqrEB__RKjtVvARlIYLBkIdwVlXFh0PYBN615AgXk1RrlmrRzqFfV8r7DRWIuEbeRTeetKTBBWNBd/pub?gid=0&single=true&output=csv";

let poems = [];
let currentIndex = 0;

const titleElement = document.getElementById("title");
const authorElement = document.getElementById("author");
const poemElement = document.getElementById("poem");
const counterElement = document.getElementById("counter");

const hands = [
    document.getElementById("hand1"),
    document.getElementById("hand2")
];

const handStates = hands.map(hand => ({
    element: hand,
    dragging: false,
    x: null,
    y: null,
    touchId: null
}));

function findColumn(row, possibleNames) {
    const keys = Object.keys(row);
    const match = keys.find(key =>
        possibleNames.includes(key.trim().toLowerCase())
    );
    return match ? row[match] : "";
}

async function loadPoems() {
    try {
        const response = await fetch(
            CSV_URL + "&refresh=" + Date.now(),
            { cache: "no-store" }
        );

        if (!response.ok) {
            throw new Error("Kon gedichten niet laden");
        }

        const csv = await response.text();

        const result = Papa.parse(csv, {
            header: true,
            skipEmptyLines: "greedy"
        });

        poems = result.data.map(row => ({
            title: findColumn(row, ["titel", "title"]),
            author: findColumn(row, ["dichter", "auteur", "author"]),
            poem: findColumn(row, ["gedicht", "tekst", "poem"])
        })).filter(item => item.poem && item.poem.trim());

        if (poems.length > 0) {
            show(0);
        }

    } catch (error) {
        poemElement.textContent = "De gedichten konden niet worden geladen.";
        console.error(error);
    }
}

function show(direction) {
    if (!poems.length) return;

    currentIndex =
        (currentIndex + direction + poems.length) % poems.length;

    const item = poems[currentIndex];

    titleElement.textContent = item.title || "";
    authorElement.textContent = item.author || "";
    poemElement.innerHTML = "";

    const paragraphs = item.poem
        .trim()
        .split(/\n\s*\n/)
        .filter(part => part.trim());

    paragraphs.forEach(text => {
        const paragraph = document.createElement("p");
        paragraph.className = "poem-paragraph";
        paragraph.textContent = text.trim();
        poemElement.appendChild(paragraph);
    });

    counterElement.textContent =
        (currentIndex + 1) + " / " + poems.length;

    clearMagnification();
}

document.getElementById("previous")
    .addEventListener("click", () => show(-1));

document.getElementById("next")
    .addEventListener("click", () => show(1));

function clearMagnification() {
    document.querySelectorAll(".poem-paragraph.active")
        .forEach(element => element.classList.remove("active"));
}

function circleTouchesRectangle(cx, cy, radius, rect) {
    const nearestX = Math.max(rect.left, Math.min(cx, rect.right));
    const nearestY = Math.max(rect.top, Math.min(cy, rect.bottom));

    const dx = cx - nearestX;
    const dy = cy - nearestY;

    return (dx * dx + dy * dy) <= radius * radius;
}

function updateMagnification() {
    const paragraphs = Array.from(
        poemElement.querySelectorAll(".poem-paragraph")
    );

    const activeParagraphs = new Set();

    handStates.forEach(state => {
        if (state.x === null || state.y === null) return;

        let target = null;
        let nearestDistance = Infinity;

        paragraphs.forEach(paragraph => {
            const rect = paragraph.getBoundingClientRect();

            if (circleTouchesRectangle(state.x, state.y, 21, rect)) {
                const centerX = (rect.left + rect.right) / 2;
                const centerY = (rect.top + rect.bottom) / 2;
                const distance = Math.hypot(
                    state.x - centerX,
                    state.y - centerY
                );

                if (distance < nearestDistance) {
                    nearestDistance = distance;
                    target = paragraph;
                }
            }
        });

        if (target) activeParagraphs.add(target);
    });

    paragraphs.forEach(paragraph => {
        paragraph.classList.toggle(
            "active",
            activeParagraphs.has(paragraph)
        );
    });
}

function moveHand(state, x, y) {
    state.x = x;
    state.y = y;

    const hand = state.element;
    hand.style.left = (x - hand.offsetWidth / 2) + "px";
    hand.style.top = (y - hand.offsetHeight / 2) + "px";
    hand.style.right = "auto";

    updateMagnification();
}

/* Touchbediening met onafhankelijke vingerregistratie */

handStates.forEach(state => {
    state.element.addEventListener("touchstart", event => {
        event.preventDefault();

        const touch = event.changedTouches[0];
        state.touchId = touch.identifier;
        state.dragging = true;

        state.element.classList.add("dragging");
        moveHand(state, touch.clientX, touch.clientY);
    }, { passive: false });
});

document.addEventListener("touchmove", event => {
    const activeStates = handStates.filter(state => state.dragging);
    if (!activeStates.length) return;

    event.preventDefault();

    activeStates.forEach(state => {
        const touch = Array.from(event.touches).find(
            t => t.identifier === state.touchId
        );

        if (touch) {
            moveHand(state, touch.clientX, touch.clientY);
        }
    });
}, { passive: false });

document.addEventListener("touchend", event => {
    handStates.forEach(state => {
        const ended = Array.from(event.changedTouches).some(
            t => t.identifier === state.touchId
        );

        if (ended) {
            state.dragging = false;
            state.touchId = null;
            state.element.classList.remove("dragging");
        }
    });
});

document.addEventListener("touchcancel", () => {
    handStates.forEach(state => {
        state.dragging = false;
        state.touchId = null;
        state.element.classList.remove("dragging");
    });
});

/* Muisbediening op MacBook */

handStates.forEach(state => {
    state.element.addEventListener("mousedown", event => {
        event.preventDefault();

        state.dragging = true;
        state.element.classList.add("dragging");

        moveHand(state, event.clientX, event.clientY);
    });
});

document.addEventListener("mousemove", event => {
    handStates.forEach(state => {
        if (state.dragging) {
            moveHand(state, event.clientX, event.clientY);
        }
    });
});

document.addEventListener("mouseup", () => {
    handStates.forEach(state => {
        state.dragging = false;
        state.element.classList.remove("dragging");
    });
});

loadPoems();
setInterval(loadPoems, 5 * 60 * 1000);
</script>

</body>
</html>
