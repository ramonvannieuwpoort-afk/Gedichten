
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">

<title>Gedichten</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

html {
    background: #ffffff;
}

body {
    margin: 0;
    background: #eee9df;
    color: #302c26;
    font-family: 'Cormorant Garamond', Georgia, serif;
}

.page {
    max-width: 900px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 105px 65px 65px;
    background: linear-gradient(
        to bottom,
        #ffffff 0px,
        #ffffff 25px,
        #f7f4ed 85px,
        #eee9df 210px
    );
}

header {
    position: relative;
    text-align: center;
    margin-bottom: 58px;
    padding-bottom: 25px;
    border-bottom: 1px solid #d5cdbf;
}

h1 {
    font-size: 43px;
    font-weight: 500;
    line-height: 1.1;
    margin: 0 0 8px;
}

.author {
    font-size: 21px;
    font-style: italic;
    color: #887e70;
}

.poem {
    font-size: 25px;
    line-height: 1.48;
    text-align: left;
    overflow-wrap: break-word;
}

.poem-paragraph {
    margin: 0 0 1.15em;
    font-size: inherit;
    font-weight: 400;
    line-height: inherit;
    color: #302c26;
    transition:
        font-size 0.18s ease,
        font-weight 0.18s ease,
        color 0.18s ease;
}

.poem-paragraph.active {
    font-size: 1.24em;
    font-weight: 600;
    color: #211b14;
    line-height: 1.35;
}

.navigation {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 70px;
    padding-top: 20px;
    border-top: 1px solid #d5cdbf;
}

button {
    font-family: inherit;
}

.nav-button {
    border: 0;
    background: none;
    color: #887e70;
    font-size: 20px;
    cursor: pointer;
    padding: 8px 0;
}

.counter {
    font-size: 17px;
    color: #887e70;
}

.hand {
    position: fixed;
    z-index: 9999;
    top: 105px;
    right: max(24px, calc((100vw - 770px) / 2));

    width: 54px;
    height: 54px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 1px solid #bfb3a2;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.94);

    color: #756b5e;
    font-size: 32px;
    line-height: 1;

    box-shadow: 0 2px 8px rgba(50, 40, 25, 0.12);

    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-appearance: none;
    appearance: none;
    padding: 0;
}

.hand-symbol {
    display: block;
    transform: rotate(-25deg);
    pointer-events: none;
}

.hand.dragging {
    width: 58px;
    height: 58px;
    font-size: 35px;
    cursor: grabbing;
    background: #fffdf9;
    box-shadow: 0 4px 14px rgba(50, 40, 25, 0.19);
}

.hand-hint {
    margin-top: 18px;
    font-size: 15px;
    color: #a09688;
    text-align: center;
    font-style: italic;
}

@media (max-width: 600px) {
    .page {
        padding: 75px 27px 50px;
        background: linear-gradient(
            to bottom,
            #ffffff 0px,
            #ffffff 20px,
            #f7f4ed 65px,
            #eee9df 175px
        );
    }

    h1 {
        font-size: 36px;
    }

    .author {
        font-size: 20px;
    }

    .poem {
        font-size: 22px;
        line-height: 1.45;
    }

    .poem-paragraph.active {
        font-size: 1.24em;
        line-height: 1.35;
    }

    header {
        margin-bottom: 48px;
    }

    .navigation {
        margin-top: 55px;
    }

    .hand {
        top: 76px;
        right: 16px;
    }
}
</style>
</head>

<body>

<div class="page">

    <header>
        <h1 id="title">Gedichten</h1>
        <div class="author" id="author"></div>
    </header>

    <main>
        <div class="poem" id="poem"></div>
        <div class="hand-hint">Sleep het handje over het gedicht om tekst te vergroten</div>
    </main>

    <div class="navigation">
        <button class="nav-button" id="previous">← Vorige</button>
        <div class="counter" id="counter"></div>
        <button class="nav-button" id="next">Volgende →</button>
    </div>

</div>

<button type="button" class="hand" id="hand" aria-label="Sleep om tekst te vergroten">
    <span class="hand-symbol">☚</span>
</button>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSyqrEB__RKjtVvARlIYLBkIdwVlXFh0PYBN615AgXk1RrlmrRzqFfV8r7DRWIuEbeRTeetKTBBWNBd/pub?gid=0&single=true&output=csv";

let poems = [];
let currentIndex = 0;

const titleElement = document.getElementById("title");
const authorElement = document.getElementById("author");
const poemElement = document.getElementById("poem");
const counterElement = document.getElementById("counter");
const hand = document.getElementById("hand");

function findColumn(row, possibleNames) {
    const keys = Object.keys(row);
    const match = keys.find(key =>
        possibleNames.includes(key.trim().toLowerCase())
    );
    return match ? row[match] : "";
}

async function loadPoems() {
    try {
        const response = await fetch(
            CSV_URL + "&refresh=" + Date.now(),
            { cache: "no-store" }
        );

        if (!response.ok) {
            throw new Error("Kon gedichten niet laden");
        }

        const csv = await response.text();

        const result = Papa.parse(csv, {
            header: true,
            skipEmptyLines: "greedy"
        });

        poems = result.data.map(row => ({
            title: findColumn(row, ["titel", "title"]),
            author: findColumn(row, ["dichter", "auteur", "author"]),
            poem: findColumn(row, ["gedicht", "tekst", "poem"])
        })).filter(item => item.poem && item.poem.trim());

        if (poems.length > 0) {
            show(0);
        }

    } catch (error) {
        poemElement.textContent = "De gedichten konden niet worden geladen.";
        console.error(error);
    }
}

function show(direction) {
    if (!poems.length) return;

    currentIndex = (currentIndex + direction + poems.length) % poems.length;

    const item = poems[currentIndex];

    titleElement.textContent = item.title || "";
    authorElement.textContent = item.author || "";

    poemElement.innerHTML = "";

    const paragraphs = item.poem
        .trim()
        .split(/\n\s*\n/)
        .filter(part => part.trim());

    paragraphs.forEach(text => {
        const paragraph = document.createElement("p");
        paragraph.className = "poem-paragraph";
        paragraph.textContent = text.trim();
        poemElement.appendChild(paragraph);
    });

    counterElement.textContent =
        (currentIndex + 1) + " / " + poems.length;

    clearMagnification();
}

document.getElementById("previous").addEventListener("click", () => show(-1));
document.getElementById("next").addEventListener("click", () => show(1));

function clearMagnification() {
    document.querySelectorAll(".poem-paragraph.active").forEach(element => {
        element.classList.remove("active");
    });
}

// Meet de afstand tussen de cirkel en de alinea.
// Een alinea wordt actief zodra de cirkel haar raakt.
function circleTouchesRectangle(cx, cy, radius, rect) {
    const nearestX = Math.max(rect.left, Math.min(cx, rect.right));
    const nearestY = Math.max(rect.top, Math.min(cy, rect.bottom));

    const dx = cx - nearestX;
    const dy = cy - nearestY;

    return (dx * dx + dy * dy) <= radius * radius;
}

function magnifyAt(cx, cy) {
    const radius = 27;
    const paragraphs = Array.from(
        poemElement.querySelectorAll(".poem-paragraph")
    );

    let target = null;
    let nearestDistance = Infinity;

    paragraphs.forEach(paragraph => {
        const rect = paragraph.getBoundingClientRect();

        if (circleTouchesRectangle(cx, cy, radius, rect)) {
            const centerX = (rect.left + rect.right) / 2;
            const centerY = (rect.top + rect.bottom) / 2;
            const distance = Math.hypot(cx - centerX, cy - centerY);

            if (distance < nearestDistance) {
                nearestDistance = distance;
                target = paragraph;
            }
        }
    });

    paragraphs.forEach(paragraph => {
        paragraph.classList.toggle("active", paragraph === target);
    });
}

let dragging = false;
let lastX = 0;
let lastY = 0;

function moveHand(x, y) {
    lastX = x;
    lastY = y;

    hand.style.left = (x - hand.offsetWidth / 2) + "px";
    hand.style.top = (y - hand.offsetHeight / 2) + "px";
    hand.style.right = "auto";

    magnifyAt(x, y);
}

hand.addEventListener("touchstart", event => {
    event.preventDefault();

    dragging = true;
    hand.classList.add("dragging");

    const touch = event.touches[0];
    moveHand(touch.clientX, touch.clientY);
}, { passive: false });

document.addEventListener("touchmove", event => {
    if (!dragging) return;

    event.preventDefault();

    const touch = event.touches[0];
    moveHand(touch.clientX, touch.clientY);
}, { passive: false });

document.addEventListener("touchend", () => {
    dragging = false;
    hand.classList.remove("dragging");
});

hand.addEventListener("mousedown", event => {
    event.preventDefault();

    dragging = true;
    hand.classList.add("dragging");

    moveHand(event.clientX, event.clientY);
});

document.addEventListener("mousemove", event => {
    if (!dragging) return;

    moveHand(event.clientX, event.clientY);
});

document.addEventListener("mouseup", () => {
    dragging = false;
    hand.classList.remove("dragging");
});

loadPoems();

setInterval(loadPoems, 5 * 60 * 1000);
</script>

</body>
</html>
