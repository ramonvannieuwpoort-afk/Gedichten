
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Mijn gedichten</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gedichten">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

html {
  background: #ffffff;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: #eee9df;
  color: #302c26;
  font-family: 'Cormorant Garamond', Georgia, serif;
  -webkit-font-smoothing: antialiased;
}

.page {
  max-width: 900px;
  margin: 0 auto;
  padding: 105px 65px 65px;
  min-height: 100vh;

  background: linear-gradient(
    to bottom,
    #ffffff 0px,
    #ffffff 25px,
    #f7f4ed 85px,
    #eee9df 210px
  );
}

header {
  margin-bottom: 58px;
  padding-bottom: 25px;
  border-bottom: 1px solid #d5cdbf;
  text-align: center;
}

h1 {
  font-size: 43px;
  font-weight: 500;
  letter-spacing: 0.3px;
  margin: 0 0 10px;
  line-height: 1.1;
  text-align: center;
}

.author {
  font-size: 21px;
  font-style: italic;
  color: #887e70;
  text-align: center;
}

.poem {
  font-size: 25px;
  font-weight: 400;
  line-height: 1.48;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  letter-spacing: 0.05px;
  text-align: left;
}

.navigation {
  margin-top: 70px;
  padding-top: 20px;
  border-top: 1px solid #d5cdbf;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

button {
  background: transparent;
  border: none;
  color: #887e70;
  font-family: Georgia, serif;
  font-size: 17px;
  padding: 14px 5px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.25;
}

.counter {
  font-size: 15px;
  color: #a69b8c;
  letter-spacing: 1px;
}

.status {
  font-size: 17px;
  color: #887e70;
  font-style: italic;
  padding-top: 30px;
}

@media (max-width: 600px) {
  .page {
    padding: 75px 27px 50px;

    background: linear-gradient(
      to bottom,
      #ffffff 0px,
      #ffffff 20px,
      #f7f4ed 65px,
      #eee9df 175px
    );
  }

  h1 {
    font-size: 36px;
  }

  .poem {
    font-size: 22px;
    line-height: 1.45;
  }
}
</style>
</head>

<body>

<div class="page">

<header>
  <h1 id="title">Gedichten</h1>
  <div class="author" id="author"></div>
</header>

<article class="poem" id="poem"></article>

<div class="status" id="status">Gedichten ophalen...</div>

<div class="navigation">
  <button id="previous" onclick="show(-1)">← Vorige</button>
  <span class="counter" id="counter"></span>
  <button id="next" onclick="show(1)">Volgende →</button>
</div>

</div>

<script>

const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSyqrEB__RKjtVvARlIYLBkIdwVlXFh0PYBN615AgXk1RrlmrRzqFfV8r7DRWIuEbeRTeetKTBBWNBd/pub?gid=0&single=true&output=csv";

let poems = [];
let current = 0;
let loading = false;

function findColumn(row, name) {
  const key = Object.keys(row).find(
    k => k.trim().toLowerCase() === name.toLowerCase()
  );

  return key ? row[key] : "";
}

async function loadPoems() {
  if (loading) return;

  loading = true;

  const status = document.getElementById("status");

  try {
    const response = await fetch(
      CSV_URL + "&refresh=" + Date.now(),
      {
        cache: "no-store"
      }
    );

    if (!response.ok) {
      throw new Error("Google Sheets niet bereikbaar.");
    }

    const csv = await response.text();

    const result = Papa.parse(csv, {
      header: true,
      skipEmptyLines: "greedy"
    });

    const updated = result.data.map(row => ({
      title: String(findColumn(row, "Titel") || "").trim(),
      author: String(findColumn(row, "Dichter") || "").trim(),
      text: String(findColumn(row, "Gedicht") || "").trim()
    })).filter(p => p.title && p.text);

    if (!updated.length) {
      throw new Error("Geen gedichten gevonden.");
    }

    const previousTitle = poems[current]?.title;

    poems = updated;

    const oldIndex = poems.findIndex(
      p => p.title === previousTitle
    );

    current = oldIndex >= 0 ? oldIndex : 0;

    show(0);

    status.textContent = "";

  } catch (error) {
    status.textContent =
      "Gedichten konden niet worden geladen. Controleer je internetverbinding en de Google Sheets-publicatie.";

    console.error(error);

  } finally {
    loading = false;
  }
}

function show(direction) {
  if (!poems.length) return;

  current = (current + direction + poems.length) % poems.length;

  const p = poems[current];

  document.getElementById("title").textContent = p.title;
  document.getElementById("author").textContent = p.author;
  document.getElementById("poem").textContent = p.text;

  document.getElementById("counter").textContent =
    (current + 1) + " / " + poems.length;

  document.getElementById("previous").disabled =
    poems.length < 2;

  document.getElementById("next").disabled =
    poems.length < 2;

  window.scrollTo(0, 0);
}

// Gedichten ophalen bij openen
loadPoems();

// Iedere vijf minuten opnieuw ophalen
setInterval(loadPoems, 5 * 60 * 1000);

// Opnieuw ophalen wanneer de webapp zichtbaar wordt
document.addEventListener("visibilitychange", function() {
  if (!document.hidden) {
    loadPoems();
  }
});

// Opnieuw ophalen bij activering
window.addEventListener("pageshow", function() {
  loadPoems();
});

</script>

</body>
</html>
