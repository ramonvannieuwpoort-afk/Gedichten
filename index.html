
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>Gedichten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
*{box-sizing:border-box}
html{background:#fff}
body{margin:0;background:#eee9df;color:#302c26;font-family:'Cormorant Garamond',Georgia,serif}
.page{max-width:900px;min-height:100vh;margin:0 auto;padding:105px 65px 65px;background:linear-gradient(to bottom,#fff 0px,#fff 25px,#f7f4ed 85px,#eee9df 210px)}
header{position:relative;text-align:center;margin-bottom:58px;padding-bottom:25px;border-bottom:1px solid #d5cdbf}
h1{font-size:43px;font-weight:500;line-height:1.1;margin:0 0 8px}
.author{font-size:21px;font-style:italic;color:#887e70}
.poem{font-size:25px;line-height:1.48;text-align:left;overflow-wrap:break-word;white-space:normal}
.poem-paragraph{white-space:pre-line}
.poem-paragraph{position:relative;margin:0 0 1.15em;font-size:inherit;font-weight:400;line-height:inherit;color:#302c26;transform:scale(1);transform-origin:left center;transition:transform 420ms cubic-bezier(.22,1,.36,1),font-weight 350ms ease,color 400ms ease,text-shadow 400ms ease;will-change:transform}
.poem-paragraph.active{transform:scale(1.09);font-weight:600;color:#211b14;text-shadow:0 0 .01px #211b14;z-index:2}
.poem-paragraph.has-notes{position:relative;z-index:3;pointer-events:auto;background:linear-gradient(105deg,rgba(182,154,112,.20),rgba(120,149,163,.10));border-left:2px solid #b69a70;border-radius:2px;padding:2px 9px 2px;margin-left:-11px;cursor:pointer;text-decoration:underline;text-decoration-color:rgba(137,116,83,.72);text-decoration-thickness:1px;text-underline-offset:4px;-webkit-tap-highlight-color:rgba(182,154,112,.16)}
.navigation{display:flex;justify-content:space-between;align-items:center;margin-top:70px;padding-top:20px;border-top:1px solid #d5cdbf}
button{font-family:inherit}
.nav-button{border:0;background:none;color:#887e70;font-size:20px;cursor:pointer;padding:8px 0}
.nav-button:active{color:#302c26}
.counter{font-size:17px;color:#887e70}
.hand{position:fixed;z-index:9999;top:105px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;border:0;border-radius:50%;background:transparent;box-shadow:0 2px 8px rgba(50,40,25,.14);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-appearance:none;appearance:none;padding:0;transition:width 180ms ease,height 180ms ease,box-shadow 180ms ease}
#hand1{left:max(8px,calc((100vw - 900px)/2 + 8px))}
#hand2{right:max(8px,calc((100vw - 900px)/2 + 8px))}
.hand-icon{width:100%;height:100%;display:block;overflow:visible;pointer-events:none;transform-origin:50% 50%}
#hand1 .hand-icon{transform:rotate(60deg)}
#hand2 .hand-icon{transform:rotate(-60deg)}
.hand.dragging{width:46px;height:46px;cursor:grabbing;box-shadow:0 4px 15px rgba(50,40,25,.2)}
.hand-hint{margin-top:18px;font-size:15px;color:#a09688;text-align:center;font-style:italic}
.modal-backdrop{display:none;position:fixed;top:0;right:0;bottom:0;left:0;width:100%;height:100%;z-index:20000;background:rgba(35,30,24,.42);align-items:center;justify-content:center;padding:20px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-backdrop.visible{display:-webkit-box;display:-webkit-flex;display:flex}
.modal{width:100%;max-width:460px;background:#f7f4ed;border:1px solid #d5cdbf;border-radius:4px;padding:30px;box-shadow:0 12px 40px rgba(35,30,24,.2);position:relative;margin:auto;flex-shrink:0}
.modal h2{margin:0 0 8px;font-size:29px;font-weight:500}
.modal-description{margin:0 0 20px;color:#887e70;font-size:18px;line-height:1.35}
.modal-passage{padding:12px 14px;margin-bottom:18px;background:#eee9df;border-left:2px solid #b69a70;font-size:17px;line-height:1.4;max-height:125px;overflow-y:auto}
.saved-notes{margin:0 0 18px}
.saved-note{padding:12px 14px;margin:0 0 10px;border-left:3px solid #bda27b;border-radius:2px;font-size:18px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}
.saved-note.sanne{background:linear-gradient(to right,rgba(182,145,96,.18),rgba(182,145,96,.06));border-left-color:#b88a54}
.saved-note.ramon{background:linear-gradient(to right,rgba(112,145,160,.18),rgba(112,145,160,.06));border-left-color:#7895a3}
.saved-note.unknown{background:rgba(150,140,125,.08);border-left-color:#b8ad9d}
.saved-note-person{display:block;margin-bottom:4px;color:#776b5b;font-size:15px;font-weight:600;letter-spacing:.02em}
.saved-note.ramon .saved-note-person{color:#607b88}
.saved-note.sanne .saved-note-person{color:#987044}
.saved-note-date{display:block;margin-top:4px;color:#998d7d;font-size:14px;font-style:italic}
.saved-notes-empty{margin:0 0 16px;color:#998d7d;font-size:16px;font-style:italic}
.modal input,.modal textarea{display:block;width:100%;border:1px solid #cfc5b5;border-radius:2px;background:#fffdf8;color:#302c26;font-family:inherit;font-size:18px;padding:11px 12px;margin:0 0 15px;-webkit-appearance:none;appearance:none}
.person-label{display:block;margin:0 0 7px;color:#776d60;font-size:17px}
.person-choices{display:flex;gap:12px;margin:0 0 18px}
.person-choice{flex:1;min-height:48px;border:1px solid transparent;border-radius:3px;padding:9px 14px;font-family:inherit;font-size:19px;cursor:pointer;opacity:.78;transition:opacity 160ms ease,transform 160ms ease,border-color 160ms ease}
.person-choice.sanne{color:#76552f;background:linear-gradient(135deg,rgba(182,145,96,.25),rgba(182,145,96,.09));border-color:rgba(184,138,84,.35)}
.person-choice.ramon{color:#4f6976;background:linear-gradient(135deg,rgba(112,145,160,.25),rgba(112,145,160,.09));border-color:rgba(120,149,163,.35)}
.person-choice.selected{opacity:1;border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor;transform:translateY(-1px)}
.person-choice:focus-visible,.saved-note-tools button:focus-visible{outline:2px solid #887e70;outline-offset:3px}
.modal textarea{min-height:150px;resize:vertical;line-height:1.4}
.modal-actions{display:flex;justify-content:flex-end;gap:18px;align-items:center;margin-top:8px}
.modal-button{border:0;background:none;color:#887e70;font-size:18px;padding:8px 4px;cursor:pointer}
.modal-button.primary{color:#302c26;border-bottom:1px solid #a77c48;font-weight:600}
.modal-button:disabled{opacity:.5;cursor:wait}
.modal-status{min-height:22px;margin-top:12px;color:#887e70;font-size:16px;line-height:1.3}
.saved-note-tools{display:flex;gap:14px;margin-top:10px;font-family:inherit;font-size:15px}
.saved-note-tools button{border:0;border-bottom:1px solid currentColor;padding:2px 0;background:transparent;color:#776b5b;cursor:pointer}
.saved-note.ramon .saved-note-tools button{color:#607b88}
.saved-note.sanne .saved-note-tools button{color:#987044}
@media(max-width:600px){
.page{padding:75px 27px 50px;background:linear-gradient(to bottom,#fff 0px,#fff 20px,#f7f4ed 65px,#eee9df 175px)}
h1{font-size:36px}
.author{font-size:20px}
.poem{font-size:22px;line-height:1.45}
header{margin-bottom:48px}
.navigation{margin-top:55px}
#hand1{top:76px;left:3px}
#hand2{top:76px;right:3px}
.hand{width:34px;height:34px}
.hand.dragging{width:38px;height:38px}
.hand svg{width:25px;height:25px}
.hand.dragging svg{width:28px;height:28px}
.poem-paragraph.active{transform:scale(1.07)}
.poem-paragraph.has-notes{padding-left:7px;margin-left:-9px}
.modal{padding:23px;max-width:100%}
}
@media(prefers-reduced-motion:reduce){.poem-paragraph,.hand,.hand svg{transition:none!important}}
</style>
</head>
<body>
<div class="page">
<header>
<h1 id="title">Gedichten</h1>
<div class="author" id="author"></div>
</header>
<main>
<div class="poem" id="poem"></div>
<div class="hand-hint">Sleep de handjes over het gedicht om twee passages te vergroten. Tik op een handje om een aantekening toe te voegen.</div>
</main>
<div class="navigation">
<button class="nav-button" id="previous">← Vorige</button>
<div class="counter" id="counter"></div>
<button class="nav-button" id="next">Volgende →</button>
</div>
</div>

<button type="button" class="hand" id="hand1" aria-label="Eerste Hamsa-hand"></button>
<button type="button" class="hand" id="hand2" aria-label="Tweede Hamsa-hand"></button>

<div class="modal-backdrop" id="accessBackdrop">
<div class="modal" role="dialog" aria-modal="true" aria-labelledby="accessTitle">
<h2 id="accessTitle">Toegang</h2>
<p class="modal-description">Voer de toegangscode in om aantekeningen te kunnen bewaren. Je hoeft dit op dit apparaat maar één keer te doen.</p>
<form id="accessForm">
<input type="password" id="accessCode" placeholder="Toegangscode" autocomplete="current-password" required>
<div class="modal-actions">
<button type="button" class="modal-button" id="accessCancel">Annuleren</button>
<button type="submit" class="modal-button primary">Verder</button>
</div>
</form>
<div class="modal-status" id="accessStatus"></div>
</div>
</div>

<div class="modal-backdrop" id="noteBackdrop">
<div class="modal" role="dialog" aria-modal="true" aria-labelledby="noteTitle">
<h2 id="noteTitle">Aantekeningen</h2>
<p class="modal-description" id="notePoemTitle"></p>
<div class="modal-passage" id="notePassage"></div>
<div class="saved-notes" id="savedNotes"></div>
<form id="noteForm">
<div class="person-label">Wie schrijft?</div>
<div class="person-choices" role="group" aria-label="Kies wie de aantekening schrijft">
<button type="button" class="person-choice sanne" data-person="Sanne" aria-pressed="false">Sanne</button>
<button type="button" class="person-choice ramon" data-person="Ramon" aria-pressed="false">Ramon</button>
</div>
<textarea id="noteText" placeholder="Schrijf hier een nieuwe aantekening..." maxlength="3000" required></textarea>
<div class="modal-actions">
<button type="button" class="modal-button" id="noteCancel">Sluiten</button>
<button type="button" class="modal-button" id="noteEditCancel" hidden>Wijzigen annuleren</button>
<button type="submit" class="modal-button primary" id="noteSave" disabled>Bewaren</button>
</div>
</form>
<div class="modal-status" id="noteStatus"></div>
</div>
</div>

<script>
function buildHamsaIcon(){
const ns="http://www.w3.org/2000/svg";
const svg=document.createElementNS(ns,"svg");
svg.setAttribute("viewBox","0 0 100 120");
svg.setAttribute("class","hand-icon");
svg.setAttribute("aria-hidden","true");
const clipId="hamsaClip"+Math.random().toString(36).slice(2);
const silhouette="M24 76 L8 53 Q2 44 8 36 Q15 28 23 34 L23 29 Q23 18 32 18 Q41 18 41 29 L41 17 Q41 4 50 4 Q59 4 59 17 L59 29 Q59 18 68 18 Q77 18 77 29 L77 34 Q85 28 92 36 Q98 44 92 53 L76 76 Q73 99 62 108 Q56 114 50 115 Q44 114 38 108 Q27 99 24 76 Z";
svg.innerHTML=`
<defs><clipPath id="${clipId}"><path d="${silhouette}"/></clipPath></defs>
<path d="${silhouette}" fill="#fff8e9" stroke="#352b2b" stroke-width="3.2" stroke-linejoin="round"/>
<g clip-path="url(#${clipId})">
<rect x="5" y="3" width="90" height="113" fill="#13c9d5"/>
<path d="M5 27 L24 27 L24 62 L5 62Z" fill="#ff8a24" stroke="#352b2b" stroke-width="1.5"/>
<path d="M76 27 L95 27 L95 62 L76 62Z" fill="#ff8a24" stroke="#352b2b" stroke-width="1.5"/>
<path d="M7 36 L23 36 L23 43 L7 43Z" fill="#ffe12e"/>
<path d="M77 36 L93 36 L93 43 L77 43Z" fill="#ffe12e"/>
<path d="M23 17 L41 17 L41 64 L23 64Z" fill="#ff4fa3" stroke="#352b2b" stroke-width="1.5"/>
<path d="M59 17 L77 17 L77 64 L59 64Z" fill="#ff4fa3" stroke="#352b2b" stroke-width="1.5"/>
<path d="M25 23 L39 23 L39 30 L25 30Z" fill="#ffe12e"/>
<path d="M61 23 L75 23 L75 30 L61 30Z" fill="#ffe12e"/>
<path d="M41 4 L59 4 L59 65 L41 65Z" fill="#ffe12e" stroke="#352b2b" stroke-width="1.6"/>
<path d="M44 12 Q50 5 56 12 L56 21 Q50 27 44 21Z" fill="#8b5cf6" stroke="#352b2b" stroke-width="1.2"/>
<circle cx="50" cy="15" r="3" fill="#13c9d5" stroke="#352b2b" stroke-width="1"/>
<path d="M44 31 L50 25 L56 31 L50 37Z" fill="#ff4fa3" stroke="#352b2b" stroke-width="1.2"/>
<path d="M45 45 L50 39 L55 45 L50 51Z" fill="#13c9d5" stroke="#352b2b" stroke-width="1.2"/>
<g fill="#ffe12e" stroke="#352b2b" stroke-width="1">
<path d="M29 39 L33 34 L37 39 L33 44Z"/><path d="M63 39 L67 34 L71 39 L67 44Z"/>
<path d="M12 49 L16 44 L20 49 L16 54Z"/><path d="M80 49 L84 44 L88 49 L84 54Z"/>
</g>
<g fill="#8b5cf6" stroke="#352b2b" stroke-width=".8">
<circle cx="33" cy="53" r="2.3"/><circle cx="67" cy="53" r="2.3"/><circle cx="16" cy="58" r="2"/><circle cx="84" cy="58" r="2"/>
</g>
<path d="M13 64 Q50 48 87 64 L83 91 Q75 111 50 116 Q25 111 17 91Z" fill="#ff4fa3" stroke="#352b2b" stroke-width="2"/>
<g stroke="#352b2b" stroke-width="1.4" stroke-linejoin="round">
<path d="M18 86 Q20 65 36 72 Q36 88 18 86Z" fill="#a8e63f"/>
<path d="M82 86 Q80 65 64 72 Q64 88 82 86Z" fill="#a8e63f"/>
<path d="M21 83 Q27 76 32 75" fill="none" stroke="#ff8a24" stroke-width="2"/>
<path d="M79 83 Q73 76 68 75" fill="none" stroke="#ff8a24" stroke-width="2"/>
</g>
<g transform="translate(50 83)">
<circle r="23" fill="#ffe12e" stroke="#352b2b" stroke-width="2"/>
<g fill="#13c9d5" stroke="#352b2b" stroke-width="1.2">
<path d="M0 -22 Q7 -14 0 -9 Q-7 -14 0 -22Z"/>
<path d="M0 -22 Q7 -14 0 -9 Q-7 -14 0 -22Z" transform="rotate(45)"/>
<path d="M0 -22 Q7 -14 0 -9 Q-7 -14 0 -22Z" transform="rotate(90)"/>
<path d="M0 -22 Q7 -14 0 -9 Q-7 -14 0 -22Z" transform="rotate(135)"/>
<path d="M0 -22 Q7 -14 0 -9 Q-7 -14 0 -22Z" transform="rotate(180)"/>
<path d="M0 -22 Q7 -14 0 -9 Q-7 -14 0 -22Z" transform="rotate(225)"/>
<path d="M0 -22 Q7 -14 0 -9 Q-7 -14 0 -22Z" transform="rotate(270)"/>
<path d="M0 -22 Q7 -14 0 -9 Q-7 -14 0 -22Z" transform="rotate(315)"/>
</g>
<circle r="14" fill="#8b5cf6" stroke="#352b2b" stroke-width="1.5"/>
<ellipse rx="11" ry="7.5" fill="#fff8e9" stroke="#352b2b" stroke-width="1.2"/>
<circle r="4.2" fill="#13c9d5" stroke="#352b2b" stroke-width="1"/>
<circle r="1.8" fill="#252525"/>
<circle cx="-17" cy="0" r="1.6" fill="#ff4fa3"/><circle cx="17" cy="0" r="1.6" fill="#ff4fa3"/>
</g>
<path d="M20 101 Q50 120 80 101" fill="none" stroke="#ffe12e" stroke-width="4"/>
<g fill="#8b5cf6" stroke="#352b2b" stroke-width=".8">
<circle cx="27" cy="103" r="3"/><circle cx="39" cy="109" r="3"/><circle cx="50" cy="112" r="3"/><circle cx="61" cy="109" r="3"/><circle cx="73" cy="103" r="3"/>
</g>
<g fill="#ffe12e" stroke="#352b2b" stroke-width=".7"><circle cx="32" cy="94" r="2"/><circle cx="68" cy="94" r="2"/></g>
</g>

}

document.querySelectorAll(".hand").forEach(hand=>hand.appendChild(buildHamsaIcon()));

const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vSyqrEB__RKjtVvARlIYLBkIdwVlXFh0PYBN615AgXk1RrlmrRzqFfV8r7DRWIuEbeRTeetKTBBWNBd/pub?gid=0&single=true&output=csv";
const NOTES_URL="https://script.google.com/macros/s/AKfycbximcSly2Yp2TyiIzJWdNZ2gt5QcQ5Is9rf4ITK3SHQfMaWQH6NCAUGYMw3kgJvHl36kQ/exec";
const ACCESS_STORAGE_KEY="gedichten_toegangscode";
let poems=[];
let currentIndex=0;
let dailyDayKey="";
let dailySwitchTimer=null;
let selectedPassage="";
let selectedPoemTitle="";
let notesByPassage={};
let selectedPerson="";
let editingNoteRow=null;
const titleElement=document.getElementById("title");
const authorElement=document.getElementById("author");
const poemElement=document.getElementById("poem");
const counterElement=document.getElementById("counter");
const hands=[document.getElementById("hand1"),document.getElementById("hand2")];
const accessBackdrop=document.getElementById("accessBackdrop");
const noteBackdrop=document.getElementById("noteBackdrop");
const handStates=hands.map(hand=>({element:hand,dragging:false,pointerId:null,startX:0,startY:0,moved:false,x:null,y:null,target:null}));

function findColumn(row,possibleNames){
const keys=Object.keys(row);
const match=keys.find(key=>possibleNames.includes(key.trim().toLowerCase()));
return match?row[match]:"";
}

function getPoemDayKey(now=new Date()){
const date=new Date(now);
if(date.getHours()<5)date.setDate(date.getDate()-1);
return date.getFullYear()+"-"+String(date.getMonth()+1).padStart(2,"0")+"-"+String(date.getDate()).padStart(2,"0");
}

function hashDayKey(key){
let hash=2166136261;
for(let i=0;i<key.length;i++)hash=Math.imul(hash^key.charCodeAt(i),16777619);
return hash>>>0;
}

function dailyPoemIndex(key,count){
if(count<=1)return 0;
let index=hashDayKey(key)%count;
const previousDate=new Date(key+"T12:00:00");
previousDate.setDate(previousDate.getDate()-1);
const previousKey=previousDate.getFullYear()+"-"+String(previousDate.getMonth()+1).padStart(2,"0")+"-"+String(previousDate.getDate()).padStart(2,"0");
if(index===hashDayKey(previousKey)%count)index=(index+1)%count;
return index;
}

function showDailyPoem(){
if(!poems.length)return;
renderPoem(dailyPoemIndex(dailyDayKey,poems.length));
}

function scheduleDailySwitch(){
if(dailySwitchTimer)clearTimeout(dailySwitchTimer);
const now=new Date();
const next=new Date(now);
next.setHours(5,0,0,0);
if(next<=now)next.setDate(next.getDate()+1);
dailySwitchTimer=setTimeout(()=>{
const newDayKey=getPoemDayKey();
if(newDayKey!==dailyDayKey){
dailyDayKey=newDayKey;
showDailyPoem();
}
scheduleDailySwitch();
},next-now);
}

async function loadPoems(){
try{
const previousTitle=titleElement.textContent.trim();
const previousItem=poems.find(item=>item.title===previousTitle);
const response=await fetch(CSV_URL+"&refresh="+Date.now(),{cache:"no-store"});
if(!response.ok)throw new Error("Kon gedichten niet laden");
const csv=await response.text();
const result=Papa.parse(csv,{header:true,skipEmptyLines:"greedy"});
const updatedPoems=result.data.map(row=>({title:findColumn(row,["titel","title"]),author:findColumn(row,["dichter","auteur","author"]),poem:findColumn(row,["gedicht","tekst","poem"])})).filter(item=>item.poem&&item.poem.trim());
if(!updatedPoems.length)return;
poems=updatedPoems;
const todayKey=getPoemDayKey();
if(!dailyDayKey||todayKey!==dailyDayKey){
dailyDayKey=todayKey;
showDailyPoem();
}else{
const preservedIndex=poems.findIndex(item=>item.title===previousTitle);
if(preservedIndex>=0){
currentIndex=preservedIndex;
counterElement.textContent=(currentIndex+1)+" / "+poems.length;
const currentItem=poems[currentIndex];
if(!previousItem||previousItem.poem!==currentItem.poem||previousItem.author!==currentItem.author)renderPoem(currentIndex);
}else{
showDailyPoem();
}
}
scheduleDailySwitch();
}catch(error){if(!poems.length)poemElement.textContent="De gedichten konden niet worden geladen.";console.error(error)}
}

function normalizePassage(text){return String(text||"").trim().replace(/\s+/g," ")}

function loadNotesForCurrentPoem(){
if(!titleElement.textContent.trim())return;
const callbackName="gedichtenNotesCallback"+Date.now()+Math.floor(Math.random()*100000);
const script=document.createElement("script");
const url=new URL(NOTES_URL);
url.searchParams.set("action","notes");
url.searchParams.set("gedicht",titleElement.textContent.trim());
url.searchParams.set("callback",callbackName);
let finished=false;
function cleanup(){if(finished)return;finished=true;delete window[callbackName];if(script.parentNode)script.parentNode.removeChild(script)}
window[callbackName]=function(data){
cleanup();
if(!data||!data.success||!Array.isArray(data.notes)){console.error("Aantekeningen konden niet worden opgehaald.",data);return}
notesByPassage={};
data.notes.forEach(note=>{const key=normalizePassage(note.passage);if(!notesByPassage[key])notesByPassage[key]=[];notesByPassage[key].push(note)});
applyNoteHighlights();
if(noteBackdrop.classList.contains("visible"))renderSavedNotes();
};
script.onerror=function(){cleanup();console.error("Verbinding met de aantekeningen is mislukt.")};
script.src=url.toString();
document.head.appendChild(script);
}

function applyNoteHighlights(){
poemElement.querySelectorAll(".poem-paragraph").forEach(paragraph=>{
const key=normalizePassage(paragraph.textContent);
const hasNotes=!!(notesByPassage[key]&&notesByPassage[key].length);
paragraph.classList.toggle("has-notes",hasNotes);
if(hasNotes){
paragraph.setAttribute("tabindex","0");
paragraph.setAttribute("role","button");
paragraph.setAttribute("aria-label","Aantekeningen bij deze passage openen");
}else{
paragraph.removeAttribute("tabindex");
paragraph.removeAttribute("role");
paragraph.removeAttribute("aria-label");
}
});
}

function renderPoem(index){
if(!poems.length)return;
currentIndex=(index+poems.length)%poems.length;
const item=poems[currentIndex];
titleElement.textContent=item.title||"";
authorElement.textContent=item.author||"";
poemElement.innerHTML="";
const decodedPoem=String(item.poem||"").replace(/\\n/g,"\n");
const paragraphs=decodedPoem.trim().split(/\n\s*\n/).filter(part=>part.trim());
paragraphs.forEach(text=>{
const paragraph=document.createElement("p");
paragraph.className="poem-paragraph";
paragraph.textContent=text.trim();
poemElement.appendChild(paragraph);
});
counterElement.textContent=(currentIndex+1)+" / "+poems.length;
clearMagnification();
notesByPassage={};
loadNotesForCurrentPoem();
}

function show(direction){
if(!poems.length)return;
renderPoem(currentIndex+direction);
}

document.getElementById("previous").addEventListener("click",()=>show(-1));
document.getElementById("next").addEventListener("click",()=>show(1));

function openNoteForParagraph(paragraph){
if(!paragraph||!paragraph.classList.contains("has-notes"))return;
selectedPassage=paragraph.textContent.trim();
selectedPoemTitle=titleElement.textContent.trim();
if(!selectedPassage||!selectedPoemTitle)return;
if(!localStorage.getItem(ACCESS_STORAGE_KEY)){openAccessModal();return}
openNoteModal();
}

poemElement.addEventListener("click",event=>{
const paragraph=event.composedPath().find(node=>node instanceof Element&&node.classList.contains("poem-paragraph"));
openNoteForParagraph(paragraph);
},true);

poemElement.addEventListener("keydown",event=>{
if(event.key!=="Enter"&&event.key!==" ")return;
const paragraph=event.target.closest(".poem-paragraph");
if(!paragraph||!paragraph.classList.contains("has-notes"))return;
event.preventDefault();
openNoteForParagraph(paragraph);
});

function clearMagnification(){
document.querySelectorAll(".poem-paragraph.active").forEach(element=>element.classList.remove("active"));
handStates.forEach(state=>{state.target=null});
}

function circleTouchesRectangle(cx,cy,radius,rect){
const nearestX=Math.max(rect.left,Math.min(cx,rect.right));
const nearestY=Math.max(rect.top,Math.min(cy,rect.bottom));
const dx=cx-nearestX,dy=cy-nearestY;
return(dx*dx+dy*dy)<=radius*radius;
}

function updateMagnification(){
const paragraphs=Array.from(poemElement.querySelectorAll(".poem-paragraph"));
const activeParagraphs=new Set();
handStates.forEach(state=>{
state.target=null;
if(state.x===null||state.y===null)return;
let target=null,nearestDistance=Infinity;
paragraphs.forEach(paragraph=>{
const rect=paragraph.getBoundingClientRect();
if(circleTouchesRectangle(state.x,state.y,21,rect)){
const centerX=(rect.left+rect.right)/2;
const centerY=(rect.top+rect.bottom)/2;
const distance=Math.hypot(state.x-centerX,state.y-centerY);
if(distance<nearestDistance){nearestDistance=distance;target=paragraph}
}
});
if(target){state.target=target;activeParagraphs.add(target)}
});
paragraphs.forEach(paragraph=>paragraph.classList.toggle("active",activeParagraphs.has(paragraph)));
}

function moveHand(state,x,y){
state.x=x;state.y=y;
const hand=state.element;
hand.style.left=(x-hand.offsetWidth/2)+"px";
hand.style.top=(y-hand.offsetHeight/2)+"px";
hand.style.right="auto";
updateMagnification();
}

handStates.forEach(state=>{
state.element.addEventListener("pointerdown",event=>{
if(event.button!==undefined&&event.button!==0)return;
event.preventDefault();
state.dragging=true;state.pointerId=event.pointerId;state.startX=event.clientX;state.startY=event.clientY;state.moved=false;
state.element.classList.add("dragging");
if(state.element.setPointerCapture)state.element.setPointerCapture(event.pointerId);
moveHand(state,event.clientX,event.clientY);
});
state.element.addEventListener("pointermove",event=>{
if(!state.dragging||state.pointerId!==event.pointerId)return;
event.preventDefault();
if(Math.hypot(event.clientX-state.startX,event.clientY-state.startY)>8)state.moved=true;
moveHand(state,event.clientX,event.clientY);
});
function finishPointer(event){
if(!state.dragging||state.pointerId!==event.pointerId)return;
state.dragging=false;state.pointerId=null;state.element.classList.remove("dragging");
if(!state.moved)openNoteForHand(state);
}
state.element.addEventListener("pointerup",finishPointer);
state.element.addEventListener("pointercancel",event=>{
if(state.pointerId!==event.pointerId)return;
state.dragging=false;state.pointerId=null;state.element.classList.remove("dragging");
});
});

function openNoteForHand(state){
if(!state.target||!state.target.isConnected)return;
selectedPassage=state.target.textContent.trim();
selectedPoemTitle=titleElement.textContent.trim();
if(!selectedPassage||!selectedPoemTitle)return;
if(!localStorage.getItem(ACCESS_STORAGE_KEY)){openAccessModal();return}
openNoteModal();
}

function openAccessModal(){
document.getElementById("accessCode").value="";
document.getElementById("accessStatus").textContent="";
accessBackdrop.classList.add("visible");
setTimeout(()=>document.getElementById("accessCode").focus(),300);
}

function closeAccessModal(){accessBackdrop.classList.remove("visible")}
document.getElementById("accessCancel").addEventListener("click",closeAccessModal);
document.getElementById("accessForm").addEventListener("submit",event=>{
event.preventDefault();
const code=document.getElementById("accessCode").value.trim();
if(!code)return;
localStorage.setItem(ACCESS_STORAGE_KEY,code);
closeAccessModal();
openNoteModal();
});

function renderSavedNotes(){
const container=document.getElementById("savedNotes");
container.innerHTML="";
const key=normalizePassage(selectedPassage);
const notes=notesByPassage[key]||[];
if(!notes.length){
const empty=document.createElement("p");
empty.className="saved-notes-empty";
empty.textContent="Er zijn nog geen aantekeningen bij deze passage.";
container.appendChild(empty);
return;
}
notes.forEach(note=>{
const item=document.createElement("div");
const person=String(note.persoon||"").trim();
const personClass=person.toLowerCase()==="sanne"?"sanne":person.toLowerCase()==="ramon"?"ramon":"unknown";
item.className="saved-note "+personClass;
const personLabel=document.createElement("span");
personLabel.className="saved-note-person";
personLabel.textContent=person||"Eerder opgeslagen";
const text=document.createElement("div");
text.textContent=note.aantekening||"";
const date=document.createElement("span");
date.className="saved-note-date";
date.textContent=note.datum||"";
item.appendChild(personLabel);
item.appendChild(text);
if(note.datum)item.appendChild(date);
if(selectedPerson&&person===selectedPerson&&note.row){
const tools=document.createElement("div");
tools.className="saved-note-tools";
const edit=document.createElement("button");
edit.type="button";edit.textContent="Wijzigen";
edit.addEventListener("click",()=>startEditingNote(note));
const remove=document.createElement("button");
remove.type="button";remove.textContent="Verwijderen";
remove.addEventListener("click",()=>deleteNote(note));
tools.append(edit,remove);
item.appendChild(tools);
}
container.appendChild(item);
});
}

function setSelectedPerson(person){
selectedPerson=person;
document.querySelectorAll(".person-choice").forEach(button=>{
const selected=button.dataset.person===person;
button.classList.toggle("selected",selected);
button.setAttribute("aria-pressed",selected?"true":"false");
});
document.getElementById("noteSave").disabled=!person;
renderSavedNotes();
}

document.querySelectorAll(".person-choice").forEach(button=>button.addEventListener("click",()=>setSelectedPerson(button.dataset.person)));

function resetNoteEditor(){
editingNoteRow=null;
document.getElementById("noteText").value="";
document.getElementById("noteText").placeholder="Schrijf hier een nieuwe aantekening...";
document.getElementById("noteSave").textContent="Bewaren";
document.getElementById("noteEditCancel").hidden=true;
document.getElementById("noteStatus").textContent="";
}

function openNoteModal(){
document.getElementById("notePoemTitle").textContent=selectedPoemTitle;
document.getElementById("notePassage").textContent=selectedPassage;
resetNoteEditor();
setSelectedPerson("");
renderSavedNotes();
document.getElementById("noteSave").disabled=true;
noteBackdrop.classList.add("visible");
}

function startEditingNote(note){
if(!selectedPerson||note.persoon!==selectedPerson)return;
editingNoteRow=Number(note.row);
document.getElementById("noteText").value=note.aantekening||"";
document.getElementById("noteText").placeholder="Pas je aantekening aan...";
document.getElementById("noteSave").textContent="Wijziging bewaren";
document.getElementById("noteEditCancel").hidden=false;
document.getElementById("noteStatus").textContent="Je wijzigt je eigen aantekening.";
document.getElementById("noteText").focus();
}

document.getElementById("noteEditCancel").addEventListener("click",resetNoteEditor);

async function sendNoteAction(action,note){
const token=localStorage.getItem(ACCESS_STORAGE_KEY);
const formData=new URLSearchParams();
formData.append("action",action);
formData.append("token",token||"");
formData.append("persoon",selectedPerson);
formData.append("row",String(note.row));
await fetch(NOTES_URL,{method:"POST",mode:"no-cors",body:formData});
}

async function deleteNote(note){
if(!selectedPerson||note.persoon!==selectedPerson)return;
if(!window.confirm("Wil je deze eigen aantekening definitief verwijderen?"))return;
const status=document.getElementById("noteStatus");
status.textContent="Aantekening wordt verwijderd...";
try{
await sendNoteAction("delete",note);
status.textContent="Verwijderverzoek verzonden.";
setTimeout(loadNotesForCurrentPoem,1200);
}catch(error){status.textContent="Verwijderen is niet gelukt. Probeer opnieuw."}
}

function closeNoteModal(){noteBackdrop.classList.remove("visible")}
document.getElementById("noteCancel").addEventListener("click",closeNoteModal);

document.getElementById("noteForm").addEventListener("submit",async event=>{
event.preventDefault();
const noteText=document.getElementById("noteText").value.trim();
const token=localStorage.getItem(ACCESS_STORAGE_KEY);
const statusElement=document.getElementById("noteStatus");
const saveButton=document.getElementById("noteSave");
if(!token){closeNoteModal();openAccessModal();return}
if(!selectedPerson){statusElement.textContent="Kies eerst Sanne of Ramon.";return}
if(!noteText){statusElement.textContent="Schrijf eerst een aantekening.";return}
saveButton.disabled=true;
statusElement.textContent=editingNoteRow?"Wijziging wordt opgeslagen...":"Aantekening wordt opgeslagen...";
const formData=new URLSearchParams();
formData.append("action",editingNoteRow?"update":"create");
formData.append("token",token);
formData.append("gedicht",selectedPoemTitle);
formData.append("passage",selectedPassage);
formData.append("aantekening",noteText);
formData.append("persoon",selectedPerson);
if(editingNoteRow)formData.append("row",String(editingNoteRow));
try{
await fetch(NOTES_URL,{method:"POST",mode:"no-cors",body:formData});
statusElement.textContent=editingNoteRow?"Wijzigverzoek verzonden.":"Opslagverzoek verzonden.";
resetNoteEditor();
saveButton.disabled=!selectedPerson;
setTimeout(loadNotesForCurrentPoem,1200);
}catch(error){
console.error("Fout bij opslaan van aantekening:",error);
statusElement.textContent="Opslaan is niet gelukt. Controleer je internetverbinding.";
saveButton.disabled=!selectedPerson;
}
});

accessBackdrop.addEventListener("click",event=>{if(event.target===accessBackdrop)closeAccessModal()});
noteBackdrop.addEventListener("click",event=>{if(event.target===noteBackdrop)closeNoteModal()});
document.addEventListener("keydown",event=>{if(event.key==="Escape"){closeAccessModal();closeNoteModal()}});
loadPoems();
setInterval(loadPoems,5*60*1000);
</script>
