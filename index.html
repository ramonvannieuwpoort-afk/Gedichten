
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>Gedichten</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
* { box-sizing: border-box; }

html { background: #fff; }

body {
    margin: 0;
    background: #eee9df;
    color: #302c26;
    font-family: 'Cormorant Garamond', Georgia, serif;
}

.page {
    max-width: 900px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 105px 65px 65px;
    background: linear-gradient(
        to bottom,
        #fff 0px,
        #fff 25px,
        #f7f4ed 85px,
        #eee9df 210px
    );
}

header {
    position: relative;
    text-align: center;
    margin-bottom: 58px;
    padding-bottom: 25px;
    border-bottom: 1px solid #d5cdbf;
}

h1 {
    font-size: 43px;
    font-weight: 500;
    line-height: 1.1;
    margin: 0 0 8px;
}

.author {
    font-size: 21px;
    font-style: italic;
    color: #887e70;
}

.poem {
    font-size: 25px;
    line-height: 1.48;
    text-align: left;
    overflow-wrap: break-word;
}

.poem-paragraph {
    position: relative;
    margin: 0 0 1.15em;
    font-size: inherit;
    font-weight: 400;
    line-height: inherit;
    color: #302c26;
    transform: scale(1);
    transform-origin: left center;
    transition:
        transform 420ms cubic-bezier(0.22, 1, 0.36, 1),
        font-weight 350ms ease,
        color 400ms ease,
        text-shadow 400ms ease;
    will-change: transform;
}

.poem-paragraph.active {
    transform: scale(1.09);
    font-weight: 600;
    color: #211b14;
    text-shadow: 0 0 0.01px #211b14;
    z-index: 2;
}

.navigation {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 70px;
    padding-top: 20px;
    border-top: 1px solid #d5cdbf;
}

button { font-family: inherit; }

.nav-button {
    border: 0;
    background: none;
    color: #887e70;
    font-size: 20px;
    cursor: pointer;
    padding: 8px 0;
}

.nav-button:active { color: #302c26; }

.counter {
    font-size: 17px;
    color: #887e70;
}

/* Handjes met warme zandkleurige omlijsting */

.hand {
    position: fixed;
    z-index: 9999;
    top: 105px;
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #A77C48;
    border-radius: 50%;
    background: #D8B77A;
    box-shadow:
        0 2px 8px rgba(50, 40, 25, 0.14),
        inset 0 0 0 1px rgba(255, 248, 225, 0.45);
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-appearance: none;
    appearance: none;
    padding: 0;
    transition: width 180ms ease, height 180ms ease, box-shadow 180ms ease;
}

#hand1 {
    left: max(8px, calc((100vw - 900px) / 2 + 8px));
}

#hand2 {
    right: max(8px, calc((100vw - 900px) / 2 + 8px));
}

.hand-icon {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
    pointer-events: none;
    transform-origin: 50% 50%;
}

#hand1 .hand-icon { transform: rotate(60deg); }
#hand2 .hand-icon { transform: rotate(-60deg); }

.hand.dragging {
    width: 46px;
    height: 46px;
    cursor: grabbing;
    background: #D8B77A;
    box-shadow: 0 4px 15px rgba(50,40,25,0.2);
}

.hand-hint {
    margin-top: 18px;
    font-size: 15px;
    color: #a09688;
    text-align: center;
    font-style: italic;
}

@media (max-width: 600px) {
    .page {
        padding: 75px 27px 50px;
        background: linear-gradient(
            to bottom,
            #fff 0px,
            #fff 20px,
            #f7f4ed 65px,
            #eee9df 175px
        );
    }

    h1 { font-size: 36px; }
    .author { font-size: 20px; }

    .poem {
        font-size: 22px;
        line-height: 1.45;
    }

    header { margin-bottom: 48px; }
    .navigation { margin-top: 55px; }

    #hand1 {
        top: 76px;
        left: 3px;
    }

    #hand2 {
        top: 76px;
        right: 3px;
    }

    .hand {
        width: 34px;
        height: 34px;
    }

    .hand.dragging {
        width: 38px;
        height: 38px;
    }

    .hand svg {
        width: 25px;
        height: 25px;
    }

    .hand.dragging svg {
        width: 28px;
        height: 28px;
    }

    .poem-paragraph.active {
        transform: scale(1.07);
    }
}

@media (prefers-reduced-motion: reduce) {
    .poem-paragraph,
    .hand,
    .hand svg {
        transition: none !important;
    }
}
</style>
</head>

<body>

<div class="page">

    <header>
        <h1 id="title">Gedichten</h1>
        <div class="author" id="author"></div>
    </header>

    <main>
        <div class="poem" id="poem"></div>
        <div class="hand-hint">
            Sleep de handjes over het gedicht om twee passages te vergroten
        </div>
    </main>

    <div class="navigation">
        <button class="nav-button" id="previous">← Vorige</button>
        <div class="counter" id="counter"></div>
        <button class="nav-button" id="next">Volgende →</button>
    </div>

</div>

<button type="button" class="hand" id="hand1" aria-label="Eerste vergroothand"></button>
<button type="button" class="hand" id="hand2" aria-label="Tweede vergroothand"></button>

<script>

/* Hamsa-illustratie: symmetrisch, met centrale aanwijzende vinger.
   De illustratie zelf is ongewijzigd gebleven. */

            stroke-width="3.2" stroke-linejoin="round"/>

      <g clip-path="url(#${clipId})">

        <rect x="3" y="3" width="94" height="114" fill="#18d7df"/>

        <path d="M4 37 Q14 28 25 43 L25 67 L4 58Z"
              fill="#ff8b24" stroke="#30242d" stroke-width="1.6"/>
        <path d="M96 37 Q86 28 75 43 L75 67 L96 58Z"
              fill="#ff8b24" stroke="#30242d" stroke-width="1.6"/>

              fill="#ff4f9a" stroke="#30242d" stroke-width="1.6"/>

        <path d="M50 4 Q57 12 57 21 L57 66 L43 66 L43 21 Q43 12 50 4Z"
              fill="#ffe52e" stroke="#30242d" stroke-width="1.8"/>
        <path d="M50 10 L55 20 L50 26 L45 20Z"
              fill="#ff4f9a" stroke="#30242d" stroke-width="1.2"/>
        <circle cx="50" cy="17" r="2.6"
                fill="#18d7df" stroke="#30242d" stroke-width="1"/>
        <path d="M45 34 L50 29 L55 34 L50 39Z"
              fill="#8b4df5" stroke="#30242d" stroke-width="1.1"/>
        <path d="M45 48 L50 42 L55 48 L50 54Z"
              fill="#ff4f9a" stroke="#30242d" stroke-width="1.1"/>

        <g stroke="#30242d" stroke-width="1.1" stroke-linejoin="round">
          <path d="M29 30 L34 25 L39 30 L34 35Z" fill="#ffe52e"/>
          <path d="M71 30 L66 25 L61 30 L66 35Z" fill="#ffe52e"/>
          <path d="M29 46 L34 40 L39 46 L34 52Z" fill="#18d7df"/>
          <path d="M71 46 L66 40 L61 46 L66 52Z" fill="#18d7df"/>
          <path d="M10 48 L16 42 L22 48 L16 54Z" fill="#ff4f9a"/>
          <path d="M90 48 L84 42 L78 48 L84 54Z" fill="#ff4f9a"/>
        </g>

        <g fill="#ffe52e" stroke="#30242d" stroke-width="0.9">
          <circle cx="34" cy="58" r="2.2"/>
          <circle cx="66" cy="58" r="2.2"/>
          <circle cx="16" cy="60" r="2"/>
          <circle cx="84" cy="60" r="2"/>
        </g>

        <path d="M5 43 Q15 35 26 52 L35 75 L23 88 Q14 77 7 65Z"
              fill="#ffb52e" stroke="#30242d" stroke-width="1.8"/>
        <path d="M95 43 Q85 35 74 52 L65 75 L77 88 Q86 77 93 65Z"
              fill="#ffb52e" stroke="#30242d" stroke-width="1.8"/>

        <path d="M9 51 Q17 44 24 57 L18 67Z"
              fill="#8b4df5" stroke="#30242d" stroke-width="1.2"/>
        <path d="M91 51 Q83 44 76 57 L82 67Z"
              fill="#8b4df5" stroke="#30242d" stroke-width="1.2"/>

        <path d="M17 65 Q50 51 83 65 L80 91 Q73 110 50 116 Q27 110 20 91Z"
              fill="#ff4f9a" stroke="#30242d" stroke-width="2"/>

        <g stroke="#30242d" stroke-width="1.4" stroke-linejoin="round">
          <path d="M19 88 Q19 67 36 70 Q37 87 19 88Z" fill="#a8ef36"/>
          <path d="M81 88 Q81 67 64 70 Q63 87 81 88Z" fill="#a8ef36"/>
          <path d="M22 84 Q28 76 34 73" fill="none" stroke="#ff8b24" stroke-width="2"/>
          <path d="M78 84 Q72 76 66 73" fill="none" stroke="#ff8b24" stroke-width="2"/>
          <path d="M25 91 L34 82 L39 94 L31 100Z" fill="#18d7df"/>
          <path d="M75 91 L66 82 L61 94 L69 100Z" fill="#18d7df"/>
        </g>

        <g transform="translate(50 84)">
          <circle r="23" fill="#ffe52e" stroke="#30242d" stroke-width="2"/>

          <g fill="#18d7df" stroke="#30242d" stroke-width="1.1">
            <path d="M0 -22 Q7 -14 0 -9 Q-7 -14 0 -22Z"/>
            <path d="M0 -22 Q7 -14 0 -9 Q-7 -14 0 -22Z" transform="rotate(45)"/>
            <path d="M0 -22 Q7 -14 0 -9 Q-7 -14 0 -22Z" transform="rotate(90)"/>
            <path d="M0 -22 Q7 -14 0 -9 Q-7 -14 0 -22Z" transform="rotate(135)"/>
            <path d="M0 -22 Q7 -14 0 -9 Q-7 -14 0 -22Z" transform="rotate(180)"/>
            <path d="M0 -22 Q7 -14 0 -9 Q-7 -14 0 -22Z" transform="rotate(225)"/>
            <path d="M0 -22 Q7 -14 0 -9 Q-7 -14 0 -22Z" transform="rotate(270)"/>
            <path d="M0 -22 Q7 -14 0 -9 Q-7 -14 0 -22Z" transform="rotate(315)"/>
          </g>

          <circle r="14.5" fill="#8b4df5" stroke="#30242d" stroke-width="1.5"/>
          <circle r="11" fill="#ffe52e" stroke="#30242d" stroke-width="1.2"/>

          <circle r="4" fill="#18d7df" stroke="#30242d" stroke-width="1"/>

        <path d="M20 101 Q50 120 80 101"
              fill="none" stroke="#ffe52e" stroke-width="4"/>

        <g fill="#8b4df5" stroke="#30242d" stroke-width="0.8">
          <circle cx="27" cy="103" r="3"/>
          <circle cx="39" cy="109" r="3"/>

}

document.querySelectorAll(".hand").forEach(hand => {
    hand.appendChild(buildHamsaIcon());
});


const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSyqrEB__RKjtVvARlIYLBkIdwVlXFh0PYBN615AgXk1RrlmrRzqFfV8r7DRWIuEbeRTeetKTBBWNBd/pub?gid=0&single=true&output=csv";

let poems = [];
let currentIndex = 0;

const titleElement = document.getElementById("title");
const authorElement = document.getElementById("author");
const poemElement = document.getElementById("poem");
const counterElement = document.getElementById("counter");

const hands = [
    document.getElementById("hand1"),
    document.getElementById("hand2")
];

const handStates = hands.map(hand => ({
    element: hand,
    dragging: false,
    x: null,
    y: null,
    touchId: null
}));

function findColumn(row, possibleNames) {
    const keys = Object.keys(row);
    const match = keys.find(key =>
        possibleNames.includes(key.trim().toLowerCase())
    );
    return match ? row[match] : "";
}

async function loadPoems() {
    try {
        const response = await fetch(
            CSV_URL + "&refresh=" + Date.now(),
            { cache: "no-store" }
        );

        if (!response.ok) {
            throw new Error("Kon gedichten niet laden");
        }

        const csv = await response.text();

        const result = Papa.parse(csv, {
            header: true,
            skipEmptyLines: "greedy"
        });

        poems = result.data.map(row => ({
            title: findColumn(row, ["titel", "title"]),
            author: findColumn(row, ["dichter", "auteur", "author"]),
            poem: findColumn(row, ["gedicht", "tekst", "poem"])
        })).filter(item => item.poem && item.poem.trim());

        if (poems.length > 0) {
            show(0);
        }

    } catch (error) {
        poemElement.textContent = "De gedichten konden niet worden geladen.";
        console.error(error);
    }
}

function show(direction) {
    if (!poems.length) return;

    currentIndex =
        (currentIndex + direction + poems.length) % poems.length;

    const item = poems[currentIndex];

    titleElement.textContent = item.title || "";
    authorElement.textContent = item.author || "";
    poemElement.innerHTML = "";

    const paragraphs = item.poem
        .trim()
        .split(/\n\s*\n/)
        .filter(part => part.trim());

    paragraphs.forEach(text => {
        const paragraph = document.createElement("p");
        paragraph.className = "poem-paragraph";
        paragraph.textContent = text.trim();
        poemElement.appendChild(paragraph);
    });

    counterElement.textContent =
        (currentIndex + 1) + " / " + poems.length;

    clearMagnification();
}

document.getElementById("previous")
    .addEventListener("click", () => show(-1));

document.getElementById("next")
    .addEventListener("click", () => show(1));

function clearMagnification() {
    document.querySelectorAll(".poem-paragraph.active")
        .forEach(element => element.classList.remove("active"));
}

function circleTouchesRectangle(cx, cy, radius, rect) {
    const nearestX = Math.max(rect.left, Math.min(cx, rect.right));
    const nearestY = Math.max(rect.top, Math.min(cy, rect.bottom));

    const dx = cx - nearestX;
    const dy = cy - nearestY;

    return (dx * dx + dy * dy) <= radius * radius;
}

function updateMagnification() {
    const paragraphs = Array.from(
        poemElement.querySelectorAll(".poem-paragraph")
    );

    const activeParagraphs = new Set();

    handStates.forEach(state => {
        if (state.x === null || state.y === null) return;

        let target = null;
        let nearestDistance = Infinity;

        paragraphs.forEach(paragraph => {
            const rect = paragraph.getBoundingClientRect();

            if (circleTouchesRectangle(state.x, state.y, 21, rect)) {
                const centerX = (rect.left + rect.right) / 2;
                const centerY = (rect.top + rect.bottom) / 2;
                const distance = Math.hypot(
                    state.x - centerX,
                    state.y - centerY
                );

                if (distance < nearestDistance) {
                    nearestDistance = distance;
                    target = paragraph;
                }
            }
        });

        if (target) activeParagraphs.add(target);
    });

    paragraphs.forEach(paragraph => {
        paragraph.classList.toggle(
            "active",
            activeParagraphs.has(paragraph)
        );
    });
}

function moveHand(state, x, y) {
    state.x = x;
    state.y = y;

    const hand = state.element;
    hand.style.left = (x - hand.offsetWidth / 2) + "px";
    hand.style.top = (y - hand.offsetHeight / 2) + "px";
    hand.style.right = "auto";

    updateMagnification();
}

/* Touchbediening met onafhankelijke vingerregistratie */

handStates.forEach(state => {
    state.element.addEventListener("touchstart", event => {
        event.preventDefault();

        const touch = event.changedTouches[0];
        state.touchId = touch.identifier;
        state.dragging = true;

        state.element.classList.add("dragging");
        moveHand(state, touch.clientX, touch.clientY);
    }, { passive: false });
});

document.addEventListener("touchmove", event => {
    const activeStates = handStates.filter(state => state.dragging);
    if (!activeStates.length) return;

    event.preventDefault();

    activeStates.forEach(state => {
        const touch = Array.from(event.touches).find(
            t => t.identifier === state.touchId
        );

        if (touch) {
            moveHand(state, touch.clientX, touch.clientY);
        }
    });
}, { passive: false });

document.addEventListener("touchend", event => {
    handStates.forEach(state => {
        const ended = Array.from(event.changedTouches).some(
            t => t.identifier === state.touchId
        );

        if (ended) {
            state.dragging = false;
            state.touchId = null;
            state.element.classList.remove("dragging");
        }
    });
});

document.addEventListener("touchcancel", () => {
    handStates.forEach(state => {
        state.dragging = false;
        state.touchId = null;
        state.element.classList.remove("dragging");
    });
});

/* Muisbediening op MacBook */

handStates.forEach(state => {
    state.element.addEventListener("mousedown", event => {
        event.preventDefault();

        state.dragging = true;
        state.element.classList.add("dragging");

        moveHand(state, event.clientX, event.clientY);
    });
});

document.addEventListener("mousemove", event => {
    handStates.forEach(state => {
        if (state.dragging) {
            moveHand(state, event.clientX, event.clientY);
        }
    });
});

document.addEventListener("mouseup", () => {
    handStates.forEach(state => {
        state.dragging = false;
        state.element.classList.remove("dragging");
    });
});

loadPoems();
setInterval(loadPoems, 5 * 60 * 1000);
</script>

</body>
</html>
