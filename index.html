
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>Gedichten</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
* { box-sizing: border-box; }

html { background: #fff; }

body {
    margin: 0;
    background: #eee9df;
    color: #302c26;
    font-family: 'Cormorant Garamond', Georgia, serif;
}

.page {
    max-width: 900px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 105px 65px 65px;
    background: linear-gradient(
        to bottom,
        #fff 0px,
        #fff 25px,
        #f7f4ed 85px,
        #eee9df 210px
    );
}

header {
    position: relative;
    text-align: center;
    margin-bottom: 58px;
    padding-bottom: 25px;
    border-bottom: 1px solid #d5cdbf;
}

h1 {
    font-size: 43px;
    font-weight: 500;
    line-height: 1.1;
    margin: 0 0 8px;
}

.author {
    font-size: 21px;
    font-style: italic;
    color: #887e70;
}

.poem {
    font-size: 25px;
    line-height: 1.48;
    text-align: left;
    overflow-wrap: break-word;
}

.poem-paragraph {
    position: relative;
    margin: 0 0 1.15em;
    font-size: inherit;
    font-weight: 400;
    line-height: inherit;
    color: #302c26;
    transform: scale(1);
    transform-origin: left center;
    transition:
        transform 420ms cubic-bezier(0.22, 1, 0.36, 1),
        font-weight 350ms ease,
        color 400ms ease,
        text-shadow 400ms ease;
    will-change: transform;
}

.poem-paragraph.active {
    transform: scale(1.09);
    font-weight: 600;
    color: #211b14;
    text-shadow: 0 0 0.01px #211b14;
    z-index: 2;
}

.poem-paragraph.has-note::after {
    content: " ·";
    color: #a77c48;
    font-weight: 600;
}

.navigation {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 70px;
    padding-top: 20px;
    border-top: 1px solid #d5cdbf;
}

button { font-family: inherit; }

.nav-button {
    border: 0;
    background: none;
    color: #887e70;
    font-size: 20px;
    cursor: pointer;
    padding: 8px 0;
}

.nav-button:active { color: #302c26; }

.counter {
    font-size: 17px;
    color: #887e70;
}

/* Hamsa-handjes */

.hand {
    position: fixed;
    z-index: 9999;
    top: 105px;
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #A77C48;
    border-radius: 50%;
    background: #D8B77A;
    box-shadow:
        0 2px 8px rgba(50, 40, 25, 0.14),
        inset 0 0 0 1px rgba(255, 248, 225, 0.45);
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-appearance: none;
    appearance: none;
    padding: 0;
    transition: width 180ms ease, height 180ms ease, box-shadow 180ms ease;
}

#hand1 { left: max(8px, calc((100vw - 900px) / 2 + 8px)); }
#hand2 { right: max(8px, calc((100vw - 900px) / 2 + 8px)); }

.hand-icon {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
    pointer-events: none;
    transform-origin: 50% 50%;
}

#hand1 .hand-icon { transform: rotate(60deg); }
#hand2 .hand-icon { transform: rotate(-60deg); }

.hand.dragging {
    width: 46px;
    height: 46px;
    cursor: grabbing;
    background: #D8B77A;
    box-shadow: 0 4px 15px rgba(50,40,25,0.2);
}

.hand-hint {
    margin-top: 18px;
    font-size: 15px;
    color: #a09688;
    text-align: center;
    font-style: italic;
}

/* Notitievenster */

.note-overlay {
    position: fixed;
    inset: 0;
    z-index: 20000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(48, 44, 38, 0.35);
    font-family: 'Cormorant Garamond', Georgia, serif;
}

.note-overlay.visible {
    display: flex;
}

.note-card {
    width: 100%;
    max-width: 440px;
    padding: 28px;
    border-radius: 4px;
    background: #f7f4ed;
    box-shadow: 0 12px 40px rgba(40, 30, 20, 0.2);
}

.note-card h2 {
    margin: 0 0 8px;
    font-size: 29px;
    font-weight: 500;
}

.note-context {
    margin: 0 0 20px;
    padding: 12px 14px;
    border-left: 2px solid #c4a46d;
    color: #776d60;
    font-size: 19px;
    font-style: italic;
    line-height: 1.4;
    max-height: 130px;
    overflow-y: auto;
}

.note-card label {
    display: block;
    margin-bottom: 7px;
    color: #887e70;
    font-size: 17px;
}

.note-card textarea {
    display: block;
    width: 100%;
    min-height: 125px;
    resize: vertical;
    border: 1px solid #d5cdbf;
    border-radius: 3px;
    background: #fffdf8;
    color: #302c26;
    padding: 12px;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 19px;
    line-height: 1.4;
    outline: none;
}

.note-card textarea:focus {
    border-color: #a77c48;
}

.note-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-top: 18px;
}

.note-actions button {
    border: 0;
    border-radius: 3px;
    padding: 9px 17px;
    font-size: 17px;
    cursor: pointer;
}

.note-cancel {
    background: transparent;
    color: #887e70;
}

.note-save {
    background: #a77c48;
    color: white;
}

.note-save:disabled {
    opacity: 0.5;
    cursor: wait;
}

.note-status {
    min-height: 22px;
    margin-top: 12px;
    color: #887e70;
    font-size: 16px;
}

.access-overlay {
    position: fixed;
    inset: 0;
    z-index: 30000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(48, 44, 38, 0.5);
    font-family: 'Cormorant Garamond', Georgia, serif;
}

.access-overlay.visible {
    display: flex;
}

.access-card {
    width: 100%;
    max-width: 380px;
    padding: 28px;
    background: #f7f4ed;
    border-radius: 4px;
    box-shadow: 0 12px 40px rgba(40, 30, 20, 0.2);
}

.access-card h2 {
    margin: 0 0 8px;
    font-size: 29px;
    font-weight: 500;
}

.access-card p {
    margin: 0 0 18px;
    color: #776d60;
    font-size: 18px;
}

.access-card input {
    width: 100%;
    padding: 11px;
    border: 1px solid #d5cdbf;
    background: #fffdf8;
    font-family: inherit;
    font-size: 19px;
}

.access-card button {
    width: 100%;
    margin-top: 15px;
    padding: 10px;
    border: 0;
    border-radius: 3px;
    background: #a77c48;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

.access-error {
    min-height: 22px;
    margin-top: 10px;
    color: #a34d3e;
    font-size: 16px;
}

@media (max-width: 600px) {
    .page {
        padding: 75px 27px 50px;
        background: linear-gradient(
            to bottom,
            #fff 0px,
            #fff 20px,
            #f7f4ed 65px,
            #eee9df 175px
        );
    }

    h1 { font-size: 36px; }
    .author { font-size: 20px; }

    .poem {
        font-size: 22px;
        line-height: 1.45;
    }

    header { margin-bottom: 48px; }
    .navigation { margin-top: 55px; }

    #hand1 {
        top: 76px;
        left: 3px;
    }

    #hand2 {
        top: 76px;
        right: 3px;
    }

    .hand {
        width: 34px;
        height: 34px;
    }

    .hand.dragging {
        width: 38px;
        height: 38px;
    }

    .hand svg {
        width: 25px;
        height: 25px;
    }

    .hand.dragging svg {
        width: 28px;
        height: 28px;
    }

    .poem-paragraph.active {
        transform: scale(1.07);
    }

    .note-card {
        padding: 22px;
    }
}

@media (prefers-reduced-motion: reduce) {
    .poem-paragraph,
    .hand,
    .hand svg {
        transition: none !important;
    }
}
</style>
</head>

<body>

<div class="page">

    <header>
        <h1 id="title">Gedichten</h1>
        <div class="author" id="author"></div>
    </header>

    <main>
        <div class="poem" id="poem"></div>
        <div class="hand-hint">
            Sleep de handjes over het gedicht om passages te vergroten.
            Klik op een handje om een aantekening te maken.
        </div>
    </main>

    <div class="navigation">
        <button class="nav-button" id="previous">← Vorige</button>
        <div class="counter" id="counter"></div>
        <button class="nav-button" id="next">Volgende →</button>
    </div>

</div>

<button type="button" class="hand" id="hand1" aria-label="Eerste vergroothand"></button>
<button type="button" class="hand" id="hand2" aria-label="Tweede vergroothand"></button>

<!-- Notitievenster -->
<div class="note-overlay" id="noteOverlay">
    <div class="note-card">
        <h2>Een persoonlijke aantekening</h2>
        <div class="note-context" id="noteContext"></div>

        <label for="noteText">Wat wil je hierover bewaren?</label>
        <textarea id="noteText" maxlength="3000"
            placeholder="Een herinnering, gedachte of interpretatie voor Sanne..."></textarea>

        <div class="note-actions">
            <button class="note-cancel" id="noteCancel">Annuleren</button>
            <button class="note-save" id="noteSave">Bewaren</button>
        </div>
        <div class="note-status" id="noteStatus"></div>
    </div>
</div>

<!-- Eenmalige toegangscode -->
<div class="access-overlay" id="accessOverlay">
    <div class="access-card">
        <h2>Toegang tot aantekeningen</h2>
        <p>Voer de gedeelde toegangscode in. Dit hoeft maar één keer op dit apparaat.</p>
        <input type="password" id="accessInput"
            autocomplete="off" placeholder="Toegangscode">
        <button id="accessSave">Doorgaan</button>
        <div class="access-error" id="accessError"></div>
    </div>
</div>

<script>

/* Hamsa-illustratie: inline SVG, zonder CSS-maskers of gradients. */

function buildHamsaIcon() {

    const svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", "0 0 100 120");
    svg.setAttribute("class", "hand-icon");
    svg.setAttribute("aria-hidden", "true");

    const clipId = "hamsaClip" + Math.random().toString(36).slice(2);
    const silhouette = "M24 76 L8 53 Q2 44 8 36 Q15 28 23 34 L23 29 Q23 18 32 18 Q41 18 41 29 L41 17 Q41 4 50 4 Q59 4 59 17 L59 29 Q59 18 68 18 Q77 18 77 29 L77 34 Q85 28 92 36 Q98 44 92 53 L76 76 Q73 99 62 108 Q56 114 50 115 Q44 114 38 108 Q27 99 24 76 Z";

      <g clip-path="url(#${clipId})">
        <rect x="5" y="3" width="90" height="113" fill="#13c9d5"/>

        <path d="M5 27 L24 27 L24 62 L5 62Z" fill="#ff8a24" stroke="#352b2b" stroke-width="1.5"/>
        <path d="M76 27 L95 27 L95 62 L76 62Z" fill="#ff8a24" stroke="#352b2b" stroke-width="1.5"/>
        <path d="M7 36 L23 36 L23 43 L7 43Z" fill="#ffe12e"/>
        <path d="M77 36 L93 36 L93 43 L77 43Z" fill="#ffe12e"/>

        <path d="M23 17 L41 17 L41 64 L23 64Z" fill="#ff4fa3" stroke="#352b2b" stroke-width="1.5"/>
        <path d="M59 17 L77 17 L77 64 L59 64Z" fill="#ff4fa3" stroke="#352b2b" stroke-width="1.5"/>
        <path d="M25 23 L39 23 L39 30 L25 30Z" fill="#ffe12e"/>
        <path d="M61 23 L75 23 L75 30 L61 30Z" fill="#ffe12e"/>

        <path d="M41 4 L59 4 L59 65 L41 65Z" fill="#ffe12e" stroke="#352b2b" stroke-width="1.6"/>
        <path d="M44 12 Q50 5 56 12 L56 21 Q50 27 44 21Z" fill="#8b5cf6" stroke="#352b2b" stroke-width="1.2"/>
        <circle cx="50" cy="15" r="3" fill="#13c9d5" stroke="#352b2b" stroke-width="1"/>
        <path d="M44 31 L50 25 L56 31 L50 37Z" fill="#ff4fa3" stroke="#352b2b" stroke-width="1.2"/>
        <path d="M45 45 L50 39 L55 45 L50 51Z" fill="#13c9d5" stroke="#352b2b" stroke-width="1.2"/>

        <g fill="#ffe12e" stroke="#352b2b" stroke-width="1">
          <path d="M29 39 L33 34 L37 39 L33 44Z"/>
          <path d="M63 39 L67 34 L71 39 L67 44Z"/>
          <path d="M12 49 L16 44 L20 49 L16 54Z"/>
          <path d="M80 49 L84 44 L88 49 L84 54Z"/>
        </g>
        <g fill="#8b5cf6" stroke="#352b2b" stroke-width="0.8">
          <circle cx="33" cy="53" r="2.3"/>
          <circle cx="67" cy="53" r="2.3"/>
          <circle cx="16" cy="58" r="2"/>
          <circle cx="84" cy="58" r="2"/>
        </g>

        <path d="M13 64 Q50 48 87 64 L83 91 Q75 111 50 116 Q25 111 17 91Z"
              fill="#ff4fa3" stroke="#352b2b" stroke-width="2"/>

        <g stroke="#352b2b" stroke-width="1.4" stroke-linejoin="round">
          <path d="M18 86 Q20 65 36 72 Q36 88 18 86Z" fill="#a8e63f"/>
          <path d="M82 86 Q80 65 64 72 Q64 88 82 86Z" fill="#a8e63f"/>
          <path d="M21 83 Q27 76 32 75" fill="none" stroke="#ff8a24" stroke-width="2"/>
          <path d="M79 83 Q73 76 68 75" fill="none" stroke="#ff8a24" stroke-width="2"/>
        </g>

        <g transform="translate(50 83)">
          <circle r="23" fill="#ffe12e" stroke="#352b2b" stroke-width="2"/>
          <g fill="#13c9d5" stroke="#352b2b" stroke-width="1.2">
            <path d="M0 -22 Q7 -14 0 -9 Q-7 -14 0 -22Z"/>
            <path d="M0 -22 Q7 -14 0 -9 Q-7 -14 0 -22Z" transform="rotate(45)"/>
            <path d="M0 -22 Q7 -14 0 -9 Q-7 -14 0 -22Z" transform="rotate(90)"/>
            <path d="M0 -22 Q7 -14 0 -9 Q-7 -14 0 -22Z" transform="rotate(135)"/>
            <path d="M0 -22 Q7 -14 0 -9 Q-7 -14 0 -22Z" transform="rotate(180)"/>
            <path d="M0 -22 Q7 -14 0 -9 Q-7 -14 0 -22Z" transform="rotate(225)"/>
            <path d="M0 -22 Q7 -14 0 -9 Q-7 -14 0 -22Z" transform="rotate(270)"/>

          </g>
          <circle r="14" fill="#8b5cf6" stroke="#352b2b" stroke-width="1.5"/>

          <circle r="4.2" fill="#13c9d5" stroke="#352b2b" stroke-width="1"/>
          <circle r="1.8" fill="#252525"/>
          <circle cx="-17" cy="0" r="1.6" fill="#ff4fa3"/>
          <circle cx="17" cy="0" r="1.6" fill="#ff4fa3"/>
        </g>

        <path d="M20 101 Q50 120 80 101" fill="none" stroke="#ffe12e" stroke-width="4"/>
        <g fill="#8b5cf6" stroke="#352b2b" stroke-width="0.8">
          <circle cx="27" cy="103" r="3"/>
          <circle cx="39" cy="109" r="3"/>
          <circle cx="50" cy="112" r="3"/>
          <circle cx="61" cy="109" r="3"/>
          <circle cx="73" cy="103" r="3"/>
        </g>
        <g fill="#ffe12e" stroke="#352b2b" stroke-width="0.7">

document.querySelectorAll(".hand").forEach(hand => {
    hand.appendChild(buildHamsaIcon());
});

/* Gedichten laden */

const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSyqrEB__RKjtVvARlIYLBkIdwVlXFh0PYBN615AgXk1RrlmrRzqFfV8r7DRWIuEbeRTeetKTBBWNBd/pub?gid=0&single=true&output=csv";

/* Apps Script webapp */
const NOTES_URL = "https://script.google.com/macros/s/AKfycbximcSly2Yp2TyiIzJWdNZ2gt5QcQ5Is9rf4ITK3SHQfMaWQH6NCAUGYMw3kgJvHl36kQ/exec";

const TOKEN_STORAGE_KEY = "gedichten_toegangscode";

let poems = [];
let currentIndex = 0;
let selectedParagraph = null;
let selectedHand = null;

const titleElement = document.getElementById("title");
const authorElement = document.getElementById("author");
const poemElement = document.getElementById("poem");
const counterElement = document.getElementById("counter");

const noteOverlay = document.getElementById("noteOverlay");
const noteContext = document.getElementById("noteContext");
const noteText = document.getElementById("noteText");
const noteSave = document.getElementById("noteSave");
const noteStatus = document.getElementById("noteStatus");

const accessOverlay = document.getElementById("accessOverlay");
const accessInput = document.getElementById("accessInput");
const accessError = document.getElementById("accessError");

const hands = [
    document.getElementById("hand1"),
    document.getElementById("hand2")
];

const handStates = hands.map(hand => ({
    element: hand,
    dragging: false,
    x: null,
    y: null,
    touchId: null,
    startX: null,
    startY: null,
    moved: false
}));

function findColumn(row, possibleNames) {
    const keys = Object.keys(row);
    const match = keys.find(key =>
        possibleNames.includes(key.trim().toLowerCase())
    );
    return match ? row[match] : "";
}

async function loadPoems() {
    try {
        const response = await fetch(
            CSV_URL + "&refresh=" + Date.now(),
            { cache: "no-store" }
        );

        if (!response.ok) {
            throw new Error("Kon gedichten niet laden");
        }

        const csv = await response.text();

        const result = Papa.parse(csv, {
            header: true,
            skipEmptyLines: "greedy"
        });

        poems = result.data.map(row => ({
            title: findColumn(row, ["titel", "title"]),
            author: findColumn(row, ["dichter", "auteur", "author"]),
            poem: findColumn(row, ["gedicht", "tekst", "poem"])
        })).filter(item => item.poem && item.poem.trim());

        if (poems.length > 0) {
            show(0);
        }

    } catch (error) {
        poemElement.textContent = "De gedichten konden niet worden geladen.";
        console.error(error);
    }
}

function show(direction) {
    if (!poems.length) return;

    currentIndex =
        (currentIndex + direction + poems.length) % poems.length;

    const item = poems[currentIndex];

    titleElement.textContent = item.title || "";
    authorElement.textContent = item.author || "";
    poemElement.innerHTML = "";

    const paragraphs = item.poem
        .trim()
        .split(/\n\s*\n/)
        .filter(part => part.trim());

    paragraphs.forEach(text => {
        const paragraph = document.createElement("p");
        paragraph.className = "poem-paragraph";
        paragraph.textContent = text.trim();
        poemElement.appendChild(paragraph);
    });

    counterElement.textContent =
        (currentIndex + 1) + " / " + poems.length;

    clearMagnification();
}

document.getElementById("previous")
    .addEventListener("click", () => show(-1));

document.getElementById("next")
    .addEventListener("click", () => show(1));

function clearMagnification() {
    document.querySelectorAll(".poem-paragraph.active")
        .forEach(element => element.classList.remove("active"));
}

function circleTouchesRectangle(cx, cy, radius, rect) {
    const nearestX = Math.max(rect.left, Math.min(cx, rect.right));
    const nearestY = Math.max(rect.top, Math.min(cy, rect.bottom));

    const dx = cx - nearestX;
    const dy = cy - nearestY;

    return (dx * dx + dy * dy) <= radius * radius;
}

function findTargetParagraph(state) {
    if (state.x === null || state.y === null) return null;

    const paragraphs = Array.from(
        poemElement.querySelectorAll(".poem-paragraph")
    );

    let target = null;
    let nearestDistance = Infinity;

    paragraphs.forEach(paragraph => {
        const rect = paragraph.getBoundingClientRect();

        if (circleTouchesRectangle(state.x, state.y, 21, rect)) {
            const centerX = (rect.left + rect.right) / 2;
            const centerY = (rect.top + rect.bottom) / 2;
            const distance = Math.hypot(
                state.x - centerX,
                state.y - centerY
            );

            if (distance < nearestDistance) {
                nearestDistance = distance;
                target = paragraph;
            }
        }
    });

    return target;
}

function updateMagnification() {
    const paragraphs = Array.from(
        poemElement.querySelectorAll(".poem-paragraph")
    );

    const activeParagraphs = new Set();

    handStates.forEach(state => {
        const target = findTargetParagraph(state);
        if (target) activeParagraphs.add(target);
    });

    paragraphs.forEach(paragraph => {
        paragraph.classList.toggle(
            "active",
            activeParagraphs.has(paragraph)
        );
    });
}

function moveHand(state, x, y) {
    if (state.startX !== null &&
        Math.hypot(x - state.startX, y - state.startY) > 8) {
        state.moved = true;
    }

    state.x = x;
    state.y = y;

    const hand = state.element;
    hand.style.left = (x - hand.offsetWidth / 2) + "px";
    hand.style.top = (y - hand.offsetHeight / 2) + "px";
    hand.style.right = "auto";

    updateMagnification();
}

/* Toegangscode */

function getAccessToken() {
    return localStorage.getItem(TOKEN_STORAGE_KEY) || "";
}

function requestAccess() {
    accessOverlay.classList.add("visible");
    accessInput.focus();
}

document.getElementById("accessSave").addEventListener("click", () => {
    const token = accessInput.value.trim();

    if (!token) {
        accessError.textContent = "Vul de toegangscode in.";
        return;
    }

    localStorage.setItem(TOKEN_STORAGE_KEY, token);
    accessOverlay.classList.remove("visible");
    accessInput.value = "";
    accessError.textContent = "";
});

accessInput.addEventListener("keydown", event => {
    if (event.key === "Enter") {
        document.getElementById("accessSave").click();
    }
});

/* Notitievenster openen */

function openNote(state) {
    const paragraph = findTargetParagraph(state);

    if (!paragraph) {
        return;
    }

    selectedParagraph = paragraph;
    selectedHand = state;

    noteContext.textContent = paragraph.textContent;
    noteText.value = "";
    noteStatus.textContent = "";

    noteOverlay.classList.add("visible");

    if (!getAccessToken()) {
        noteOverlay.classList.remove("visible");
        requestAccess();
        return;
    }

    setTimeout(() => noteText.focus(), 100);
}

function closeNote() {
    noteOverlay.classList.remove("visible");
    selectedParagraph = null;
    selectedHand = null;
}

document.getElementById("noteCancel")
    .addEventListener("click", closeNote);

noteOverlay.addEventListener("click", event => {
    if (event.target === noteOverlay) closeNote();
});

/* Notitie opslaan */

noteSave.addEventListener("click", async () => {
    const token = getAccessToken();
    const aantekening = noteText.value.trim();

    if (!token) {
        closeNote();
        requestAccess();
        return;
    }

    if (!aantekening) {
        noteStatus.textContent = "Schrijf eerst een aantekening.";
        return;
    }

    if (!selectedParagraph || !poems[currentIndex]) {
        noteStatus.textContent = "Geen passage geselecteerd.";
        return;
    }

    const passage = selectedParagraph.textContent;
    const gedicht = titleElement.textContent;

    noteSave.disabled = true;
    noteStatus.textContent = "Aantekening wordt verstuurd...";

    try {
        const formData = new URLSearchParams();
        formData.append("token", token);
        formData.append("gedicht", gedicht);
        formData.append("passage", passage);
        formData.append("aantekening", aantekening);

        await fetch(NOTES_URL, {
            method: "POST",
            mode: "no-cors",
            body: formData
        });

        selectedParagraph.classList.add("has-note");
        noteStatus.textContent =
            "Verzoek verstuurd. Controleer het tabblad Aantekeningen in Google Sheets.";

        noteText.value = "";

        setTimeout(() => {
            closeNote();
        }, 2200);

    } catch (error) {
        console.error(error);
        noteStatus.textContent =
            "Versturen is niet gelukt. Controleer je internetverbinding.";
    } finally {
        noteSave.disabled = false;
    }
});

/* Touchbediening met onafhankelijke vingerregistratie */

handStates.forEach(state => {
    state.element.addEventListener("touchstart", event => {
        event.preventDefault();

        const touch = event.changedTouches[0];

        state.touchId = touch.identifier;
        state.dragging = true;
        state.moved = false;
        state.startX = touch.clientX;
        state.startY = touch.clientY;

        state.element.classList.add("dragging");
        moveHand(state, touch.clientX, touch.clientY);
    }, { passive: false });
});

document.addEventListener("touchmove", event => {
    const activeStates = handStates.filter(state => state.dragging);
    if (!activeStates.length) return;

    event.preventDefault();

    activeStates.forEach(state => {
        const touch = Array.from(event.touches).find(
            t => t.identifier === state.touchId
        );

        if (touch) {
            moveHand(state, touch.clientX, touch.clientY);
        }
    });
}, { passive: false });

document.addEventListener("touchend", event => {
    handStates.forEach(state => {
        const ended = Array.from(event.changedTouches).some(
            t => t.identifier === state.touchId
        );

        if (ended) {
            const wasTap = !state.moved;

            state.dragging = false;
            state.touchId = null;
            state.startX = null;
            state.startY = null;
            state.element.classList.remove("dragging");

            if (wasTap) {
                openNote(state);
            }
        }
    });
});

document.addEventListener("touchcancel", () => {
    handStates.forEach(state => {
        state.dragging = false;
        state.touchId = null;
        state.startX = null;
        state.startY = null;
        state.element.classList.remove("dragging");
    });
});

/* Muisbediening op MacBook */

handStates.forEach(state => {
    state.element.addEventListener("mousedown", event => {
        event.preventDefault();

        state.dragging = true;
        state.moved = false;
        state.startX = event.clientX;
        state.startY = event.clientY;

        state.element.classList.add("dragging");
        moveHand(state, event.clientX, event.clientY);
    });

    state.element.addEventListener("click", () => {
        if (!state.moved) {
            openNote(state);
        }
    });
});

document.addEventListener("mousemove", event => {
    handStates.forEach(state => {
        if (state.dragging) {
            moveHand(state, event.clientX, event.clientY);
        }
    });
});

document.addEventListener("mouseup", () => {
    handStates.forEach(state => {
        state.dragging = false;
        state.startX = null;
        state.startY = null;
        state.element.classList.remove("dragging");
    });
});

/* Start */

if (!getAccessToken()) {
    requestAccess();
}

loadPoems();
setInterval(loadPoems, 5 * 60 * 1000);

</script>
