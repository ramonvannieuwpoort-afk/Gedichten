
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">

<title>Gedichten</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

html {
    background: #ffffff;
}

body {
    margin: 0;
    background: #eee9df;
    color: #302c26;
    font-family: 'Cormorant Garamond', Georgia, serif;
}

.page {
    max-width: 900px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 105px 65px 65px;
    background: linear-gradient(
        to bottom,
        #ffffff 0px,
        #ffffff 25px,
        #f7f4ed 85px,
        #eee9df 210px
    );
}

header {
    position: relative;
    text-align: center;
    margin-bottom: 58px;
    padding-bottom: 25px;
    border-bottom: 1px solid #d5cdbf;
}

h1 {
    font-size: 43px;
    font-weight: 500;
    line-height: 1.1;
    margin: 0 0 8px;
}

.author {
    font-size: 21px;
    font-style: italic;
    color: #887e70;
}

.poem {
    font-size: 25px;
    line-height: 1.48;
    text-align: left;
    overflow-wrap: break-word;
}

.poem-paragraph {
    position: relative;
    margin: 0 0 1.15em;
    font-size: inherit;
    font-weight: 400;
    line-height: inherit;
    color: #302c26;
    transform: scale(1);
    transform-origin: left center;
    transition:
        transform 420ms cubic-bezier(0.22, 1, 0.36, 1),
        font-weight 350ms ease,
        color 400ms ease,
        text-shadow 400ms ease;
    will-change: transform;
}

.poem-paragraph.active {
    transform: scale(1.09);
    font-weight: 600;
    color: #211b14;
    text-shadow: 0 0 0.01px #211b14;
    z-index: 2;
}

.navigation {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 70px;
    padding-top: 20px;
    border-top: 1px solid #d5cdbf;
}

button {
    font-family: inherit;
}

.nav-button {
    border: 0;
    background: none;
    color: #887e70;
    font-size: 20px;
    cursor: pointer;
    padding: 8px 0;
}

.nav-button:active {
    color: #302c26;
}

.counter {
    font-size: 17px;
    color: #887e70;
}

/* Ronde hitbox en hamsa-aanwijzer */

.hand {
    position: fixed;
    z-index: 9999;
    top: 105px;
    right: max(24px, calc((100vw - 770px) / 2));

    width: 58px;
    height: 58px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 1px solid #c9beae;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.94);

    box-shadow:
        0 2px 8px rgba(50, 40, 25, 0.10),
        inset 0 0 0 3px rgba(201, 190, 174, 0.10);

    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-appearance: none;
    appearance: none;
    padding: 0;

    transition:
        width 180ms ease,
        height 180ms ease,
        box-shadow 180ms ease,
        background 180ms ease;
}

.hand.dragging {
    width: 62px;
    height: 62px;
    cursor: grabbing;
    background: #fffdf9;

    box-shadow:
        0 4px 15px rgba(50, 40, 25, 0.16),
        inset 0 0 0 3px rgba(201, 190, 174, 0.16);
}

.hand svg {
    width: 39px;
    height: 39px;
    display: block;
    overflow: visible;
    pointer-events: none;
}

.hand.dragging svg {
    width: 42px;
    height: 42px;
}

.hand-hint {
    margin-top: 18px;
    font-size: 15px;
    color: #a09688;
    text-align: center;
    font-style: italic;
}

@media (max-width: 600px) {
    .page {
        padding: 75px 27px 50px;
        background: linear-gradient(
            to bottom,
            #ffffff 0px,
            #ffffff 20px,
            #f7f4ed 65px,
            #eee9df 175px
        );
    }

    h1 {
        font-size: 36px;
    }

    .author {
        font-size: 20px;
    }

    .poem {
        font-size: 22px;
        line-height: 1.45;
    }

    header {
        margin-bottom: 48px;
    }

    .navigation {
        margin-top: 55px;
    }

    .hand {
        top: 76px;
        right: 16px;
    }

    .poem-paragraph.active {
        transform: scale(1.07);
    }
}

@media (prefers-reduced-motion: reduce) {
    .poem-paragraph,
    .hand,
    .hand svg {
        transition: none !important;
    }
}
</style>
</head>

<body>

<div class="page">

    <header>
        <h1 id="title">Gedichten</h1>
        <div class="author" id="author"></div>
    </header>

    <main>
        <div class="poem" id="poem"></div>
        <div class="hand-hint">
            Sleep het handje over het gedicht om tekst te vergroten
        </div>
    </main>

    <div class="navigation">
        <button class="nav-button" id="previous">← Vorige</button>
        <div class="counter" id="counter"></div>
        <button class="nav-button" id="next">Volgende →</button>
    </div>

</div>

<button
    type="button"
    class="hand"
    id="hand"
    aria-label="Sleep om tekst te vergroten"
>
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

        <g transform="rotate(-25 32 32)"
           fill="none"
           stroke="#756b5e"
           stroke-linecap="round"
           stroke-linejoin="round">

            <!-- Wijzende vinger en hand -->
            <path
                d="M27 48
                   C25 46 23 44 21 42
                   L13 34
                   C11 32 11 29 13 27
                   C15 25 18 25 20 27
                   L27 33
                   L27 13
                   C27 10 29 8 32 8
                   C35 8 37 10 37 13
                   L37 29
                   L42 25
                   C44 23 47 24 48 26
                   C50 28 49 31 47 33
                   L42 39
                   L40 46
                   C39 49 36 52 32 52
                   L29 52
                   C28 52 27 50 27 48 Z"
                stroke-width="1.8"
            />

            <!-- Binnenlijn handpalm -->
            <path
                d="M27 37 C30 35 34 35 38 37"
                stroke-width="1.1"
            />

            <!-- Klein decoratief oog -->
            <path
                d="M29 43
                   C31 40 35 40 37 43
                   C35 46 31 46 29 43 Z"
                stroke-width="1.1"
            />
            <circle cx="33" cy="43" r="1.2"
                    fill="#756b5e" stroke="none"/>

            <!-- Kleine ornamenten -->
            <path d="M32 18 L32 22" stroke-width="1"/>
            <path d="M30 20 L34 20" stroke-width="1"/>
            <path d="M24 38 L21 35" stroke-width="1"/>
            <path d="M40 32 L44 29" stroke-width="1"/>

            <!-- Kleine sierstipjes -->
            <circle cx="24" cy="46" r="0.8"
                    fill="#a09688" stroke="none"/>
            <circle cx="40" cy="45" r="0.8"
                    fill="#a09688" stroke="none"/>
        </g>
    </svg>
</button>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSyqrEB__RKjtVvARlIYLBkIdwVlXFh0PYBN615AgXk1RrlmrRzqFfV8r7DRWIuEbeRTeetKTBBWNBd/pub?gid=0&single=true&output=csv";

let poems = [];
let currentIndex = 0;

const titleElement = document.getElementById("title");
const authorElement = document.getElementById("author");
const poemElement = document.getElementById("poem");
const counterElement = document.getElementById("counter");
const hand = document.getElementById("hand");

function findColumn(row, possibleNames) {
    const keys = Object.keys(row);
    const match = keys.find(key =>
        possibleNames.includes(key.trim().toLowerCase())
    );
    return match ? row[match] : "";
}

async function loadPoems() {
    try {
        const response = await fetch(
            CSV_URL + "&refresh=" + Date.now(),
            { cache: "no-store" }
        );

        if (!response.ok) {
            throw new Error("Kon gedichten niet laden");
        }

        const csv = await response.text();

        const result = Papa.parse(csv, {
            header: true,
            skipEmptyLines: "greedy"
        });

        poems = result.data.map(row => ({
            title: findColumn(row, ["titel", "title"]),
            author: findColumn(row, ["dichter", "auteur", "author"]),
            poem: findColumn(row, ["gedicht", "tekst", "poem"])
        })).filter(item => item.poem && item.poem.trim());

        if (poems.length > 0) {
            show(0);
        }

    } catch (error) {
        poemElement.textContent = "De gedichten konden niet worden geladen.";
        console.error(error);
    }
}

function show(direction) {
    if (!poems.length) return;

    currentIndex =
        (currentIndex + direction + poems.length) % poems.length;

    const item = poems[currentIndex];

    titleElement.textContent = item.title || "";
    authorElement.textContent = item.author || "";

    poemElement.innerHTML = "";

    const paragraphs = item.poem
        .trim()
        .split(/\n\s*\n/)
        .filter(part => part.trim());

    paragraphs.forEach(text => {
        const paragraph = document.createElement("p");
        paragraph.className = "poem-paragraph";
        paragraph.textContent = text.trim();
        poemElement.appendChild(paragraph);
    });

    counterElement.textContent =
        (currentIndex + 1) + " / " + poems.length;

    clearMagnification();
}

document.getElementById("previous").addEventListener("click", () => show(-1));
document.getElementById("next").addEventListener("click", () => show(1));

function clearMagnification() {
    document.querySelectorAll(".poem-paragraph.active").forEach(element => {
        element.classList.remove("active");
    });
}

// Bepaal of de ronde hitbox een alinea raakt.
function circleTouchesRectangle(cx, cy, radius, rect) {
    const nearestX = Math.max(rect.left, Math.min(cx, rect.right));
    const nearestY = Math.max(rect.top, Math.min(cy, rect.bottom));

    const dx = cx - nearestX;
    const dy = cy - nearestY;

    return (dx * dx + dy * dy) <= radius * radius;
}

function magnifyAt(cx, cy) {
    const radius = 29;

    const paragraphs = Array.from(
        poemElement.querySelectorAll(".poem-paragraph")
    );

    let target = null;
    let nearestDistance = Infinity;

    paragraphs.forEach(paragraph => {
        const rect = paragraph.getBoundingClientRect();

        if (circleTouchesRectangle(cx, cy, radius, rect)) {
            const centerX = (rect.left + rect.right) / 2;
            const centerY = (rect.top + rect.bottom) / 2;
            const distance = Math.hypot(cx - centerX, cy - centerY);

            if (distance < nearestDistance) {
                nearestDistance = distance;
                target = paragraph;
            }
        }
    });

    paragraphs.forEach(paragraph => {
        paragraph.classList.toggle("active", paragraph === target);
    });
}

let dragging = false;

function moveHand(x, y) {
    hand.style.left = (x - hand.offsetWidth / 2) + "px";
    hand.style.top = (y - hand.offsetHeight / 2) + "px";
    hand.style.right = "auto";

    magnifyAt(x, y);
}

// iPad en andere touchschermen
hand.addEventListener("touchstart", event => {
    event.preventDefault();

    dragging = true;
    hand.classList.add("dragging");

    const touch = event.touches[0];
    moveHand(touch.clientX, touch.clientY);
}, { passive: false });

document.addEventListener("touchmove", event => {
    if (!dragging) return;

    event.preventDefault();

    const touch = event.touches[0];
    moveHand(touch.clientX, touch.clientY);
}, { passive: false });

document.addEventListener("touchend", () => {
    dragging = false;
    hand.classList.remove("dragging");
});

document.addEventListener("touchcancel", () => {
    dragging = false;
    hand.classList.remove("dragging");
});

// MacBook en andere muisbediening
hand.addEventListener("mousedown", event => {
    event.preventDefault();

    dragging = true;
    hand.classList.add("dragging");

    moveHand(event.clientX, event.clientY);
});

document.addEventListener("mousemove", event => {
    if (!dragging) return;

    moveHand(event.clientX, event.clientY);
});

document.addEventListener("mouseup", () => {
    dragging = false;
    hand.classList.remove("dragging");
});

// Eerste gedicht laden
loadPoems();

// Iedere vijf minuten controleren op nieuwe gedichten
setInterval(loadPoems, 5 * 60 * 1000);
</script>

</body>
</html>
