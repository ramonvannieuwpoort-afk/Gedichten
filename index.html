
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>Gedichten</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
* { box-sizing: border-box; }

html { background: #fff; }

body {
    margin: 0;
    background: #eee9df;
    color: #302c26;
    font-family: 'Cormorant Garamond', Georgia, serif;
}

.page {
    max-width: 900px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 105px 65px 65px;
    background: linear-gradient(
        to bottom,
        #fff 0px,
        #fff 25px,
        #f7f4ed 85px,
        #eee9df 210px
    );
}

header {
    position: relative;
    text-align: center;
    margin-bottom: 58px;
    padding-bottom: 25px;
    border-bottom: 1px solid #d5cdbf;
}

h1 {
    font-size: 43px;
    font-weight: 500;
    line-height: 1.1;
    margin: 0 0 8px;
}

.author {
    font-size: 21px;
    font-style: italic;
    color: #887e70;
}

.poem {
    font-size: 25px;
    line-height: 1.48;
    text-align: left;
    overflow-wrap: break-word;
}

.poem-paragraph {
    position: relative;
    margin: 0 0 1.15em;
    font-size: inherit;
    font-weight: 400;
    line-height: inherit;
    color: #302c26;
    transform: scale(1);
    transform-origin: left center;
    transition:
        transform 420ms cubic-bezier(0.22, 1, 0.36, 1),
        font-weight 350ms ease,
        color 400ms ease,
        text-shadow 400ms ease;
    will-change: transform;
}

.poem-paragraph.active {
    transform: scale(1.09);
    font-weight: 600;
    color: #211b14;
    text-shadow: 0 0 0.01px #211b14;
    z-index: 2;
}

.navigation {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 70px;
    padding-top: 20px;
    border-top: 1px solid #d5cdbf;
}

button { font-family: inherit; }

.nav-button {
    border: 0;
    background: none;
    color: #887e70;
    font-size: 20px;
    cursor: pointer;
    padding: 8px 0;
}

.nav-button:active { color: #302c26; }

.counter {
    font-size: 17px;
    color: #887e70;
}

/* Twee compacte hamsa-handjes in de zijmarges */

.hand {
    position: fixed;
    z-index: 9999;
    top: 105px;
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 0;
    border-radius: 50%;
    background: transparent;
    box-shadow: 0 2px 8px rgba(50, 40, 25, 0.14);
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-appearance: none;
    appearance: none;
    padding: 0;
    transition: width 180ms ease, height 180ms ease, box-shadow 180ms ease;
}

#hand1 { left: max(8px, calc((100vw - 900px) / 2 + 8px)); }
#hand2 { right: max(8px, calc((100vw - 900px) / 2 + 8px)); }

.hand-icon {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
    pointer-events: none;
}

.hand.dragging {
    width: 46px;
    height: 46px;
    cursor: grabbing;
    box-shadow: 0 4px 15px rgba(50,40,25,0.2);
}

.hand-hint {
    margin-top: 18px;
    font-size: 15px;
    color: #a09688;
    text-align: center;
    font-style: italic;
}

@media (max-width: 600px) {
    .page {
        padding: 75px 27px 50px;
        background: linear-gradient(
            to bottom,
            #fff 0px,
            #fff 20px,
            #f7f4ed 65px,
            #eee9df 175px
        );
    }

    h1 { font-size: 36px; }
    .author { font-size: 20px; }

    .poem {
        font-size: 22px;
        line-height: 1.45;
    }

    header { margin-bottom: 48px; }
    .navigation { margin-top: 55px; }

    #hand1 {
        top: 76px;
        left: 3px;
    }

    #hand2 {
        top: 76px;
        right: 3px;
    }

    .hand {
        width: 34px;
        height: 34px;
    }

    .hand.dragging {
        width: 38px;
        height: 38px;
    }

    .hand svg {
        width: 25px;
        height: 25px;
    }

    .hand.dragging svg {
        width: 28px;
        height: 28px;
    }

    .poem-paragraph.active {
        transform: scale(1.07);
    }
}

@media (prefers-reduced-motion: reduce) {
    .poem-paragraph,
    .hand,
    .hand svg {
        transition: none !important;
    }
}
</style>
</head>

<body>

<div class="page">

    <header>
        <h1 id="title">Gedichten</h1>
        <div class="author" id="author"></div>
    </header>

    <main>
        <div class="poem" id="poem"></div>
        <div class="hand-hint">
            Sleep de handjes over het gedicht om twee passages te vergroten
        </div>
    </main>

    <div class="navigation">
        <button class="nav-button" id="previous">← Vorige</button>
        <div class="counter" id="counter"></div>
        <button class="nav-button" id="next">Volgende →</button>
    </div>

</div>

<!-- Twee hamsa-handjes; de illustraties worden hieronder als SVG opgebouwd -->
<button type="button" class="hand" id="hand1" aria-label="Eerste vergroothand"></button>
<button type="button" class="hand" id="hand2" aria-label="Tweede vergroothand"></button>

<script>

/* Hamsa-illustratie: inline SVG, zonder CSS-maskers of gradients.
   Het silhouet en alle decoratieve details zijn vectorvormen. */

function buildHamsaIcon() {
    const ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", "0 0 100 120");
    svg.setAttribute("class", "hand-icon");
    svg.setAttribute("aria-hidden", "true");

    const silhouette = "M29 58 L29 29 C29 20 34 15 41 15 C48 15 53 20 53 29 L53 43 L53 18 C53 9 59 4 66 4 C73 4 79 9 79 18 L79 45 L79 28 C79 20 84 15 90 15 C97 15 101 21 101 29 L101 65 C101 74 96 82 89 88 L81 96 C75 107 65 113 52 114 L43 114 C30 114 20 107 15 96 L4 76 C0 68 3 60 10 57 C17 54 23 58 28 68 Z";

    svg.innerHTML = `
      <defs>
        <clipPath id="hamsaClip">
          <path d="${silhouette}"/>
        </clipPath>
      </defs>

      <path d="${silhouette}" fill="#fff8e9" stroke="#49372d"
            stroke-width="3.2" stroke-linejoin="round"/>

      <g clip-path="url(#hamsaClip)">
        <!-- Vingers -->
        <path d="M27 13 H54 V58 H27 Z" fill="#278b91"/>
        <path d="M53 2 H80 V58 H53 Z" fill="#315b96"/>
        <path d="M78 13 H104 V60 H78 Z" fill="#829b55"/>

        <!-- Vingerbanden -->
        <path d="M29 21 Q41 11 53 21 L53 28 Q41 19 29 28Z"
              fill="#e5b84e" stroke="#49372d" stroke-width="1.5"/>
        <path d="M54 11 Q66 1 78 11 L78 19 Q66 10 54 19Z"
              fill="#d87937" stroke="#49372d" stroke-width="1.5"/>
        <path d="M80 21 Q91 11 102 21 L102 28 Q91 19 80 28Z"
              fill="#bd4938" stroke="#49372d" stroke-width="1.5"/>

        <!-- Ruit- en zigzagmotieven -->
        <path d="M32 35 L41 27 L50 35 L41 43Z"
              fill="#f2c94c" stroke="#49372d" stroke-width="1.5"/>
        <path d="M57 29 L66 21 L75 29 L66 38Z"
              fill="#e5b84e" stroke="#49372d" stroke-width="1.5"/>
        <path d="M83 35 L91 27 L99 35 L91 43Z"
              fill="#d87937" stroke="#49372d" stroke-width="1.5"/>
        <path d="M29 49 L41 42 L53 49 L41 56Z"
              fill="#bd4938" stroke="#49372d" stroke-width="1.4"/>
        <path d="M53 46 L66 39 L79 46 L66 54Z"
              fill="#e5b84e" stroke="#49372d" stroke-width="1.4"/>

        <!-- Duimen -->
        <path d="M4 62 Q16 52 29 69 L38 86 L25 98 Q17 88 8 79Z"
              fill="#d87937" stroke="#49372d" stroke-width="2"/>
        <path d="M101 62 Q88 52 78 69 L67 86 L80 98 Q88 88 97 79Z"
              fill="#d87937" stroke="#49372d" stroke-width="2"/>
        <path d="M8 68 L19 61 L29 73 L18 81Z"
              fill="#e5b84e" stroke="#49372d" stroke-width="1.2"/>
        <path d="M97 68 L86 61 L76 73 L87 81Z"
              fill="#e5b84e" stroke="#49372d" stroke-width="1.2"/>

        <!-- Palm -->
        <path d="M18 58 Q50 44 82 58 L91 91 Q77 111 51 115 Q25 111 10 91Z"
              fill="#278b91" stroke="#49372d" stroke-width="2.2"/>

        <!-- Symmetrische bladeren -->
        <g fill="#829b55" stroke="#49372d" stroke-width="1.3">
          <path d="M18 86 Q27 68 36 83 Q31 95 18 86Z"/>
          <path d="M84 86 Q75 68 66 83 Q71 95 84 86Z"/>
        </g>
        <g fill="#e5b84e" stroke="#49372d" stroke-width="1">
          <path d="M22 84 L29 77 L33 86 L26 91Z"/>
          <path d="M80 84 L73 77 L69 86 L76 91Z"/>
        </g>

        <!-- Mandala en oog -->
        <g transform="translate(51 83)">
          <circle r="23" fill="#e5b84e" stroke="#49372d" stroke-width="2"/>
          <circle r="19" fill="#bd4938" stroke="#fff2d5" stroke-width="1.4"/>
          <g fill="#f2c94c" stroke="#49372d" stroke-width="1">
            <path d="M0 -22 Q5 -14 0 -10 Q-5 -14 0 -22Z"/>
            <path d="M0 -22 Q5 -14 0 -10 Q-5 -14 0 -22Z" transform="rotate(45)"/>
            <path d="M0 -22 Q5 -14 0 -10 Q-5 -14 0 -22Z" transform="rotate(90)"/>
            <path d="M0 -22 Q5 -14 0 -10 Q-5 -14 0 -22Z" transform="rotate(135)"/>
            <path d="M0 -22 Q5 -14 0 -10 Q-5 -14 0 -22Z" transform="rotate(180)"/>
            <path d="M0 -22 Q5 -14 0 -10 Q-5 -14 0 -22Z" transform="rotate(225)"/>
            <path d="M0 -22 Q5 -14 0 -10 Q-5 -14 0 -22Z" transform="rotate(270)"/>
            <path d="M0 -22 Q5 -14 0 -10 Q-5 -14 0 -22Z" transform="rotate(315)"/>
          </g>
          <circle r="12" fill="#315b96" stroke="#49372d" stroke-width="1.5"/>
          <ellipse cx="0" cy="0" rx="9" ry="6.5"
                   fill="#fff8e9" stroke="#49372d" stroke-width="1.2"/>
          <circle r="3.5" fill="#278b91" stroke="#49372d" stroke-width="0.8"/>
          <circle r="1.6" fill="#222"/>
        </g>

        <!-- Onderste kralenrand -->
        <path d="M18 101 Q51 119 84 101" fill="none"
              stroke="#e5b84e" stroke-width="3"/>
        <g fill="#f4c4d3" stroke="#49372d" stroke-width="0.8">
          <circle cx="27" cy="103" r="3"/>
          <circle cx="39" cy="109" r="3"/>
          <circle cx="51" cy="111" r="3"/>
          <circle cx="63" cy="109" r="3"/>
          <circle cx="75" cy="103" r="3"/>
        </g>
      </g>

      <path d="${silhouette}" fill="none" stroke="#49372d"
            stroke-width="2.3" stroke-linejoin="round"/>
      <path d="${silhouette}" fill="none" stroke="#fffdf8"
            stroke-width="0.8" stroke-linejoin="round"
            transform="translate(0.8 0.8)"/>
    `;

    return svg;
}

document.querySelectorAll(".hand").forEach(hand => {
    hand.appendChild(buildHamsaIcon());
});

const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSyqrEB__RKjtVvARlIYLBkIdwVlXFh0PYBN615AgXk1RrlmrRzqFfV8r7DRWIuEbeRTeetKTBBWNBd/pub?gid=0&single=true&output=csv";

let poems = [];
let currentIndex = 0;

const titleElement = document.getElementById("title");
const authorElement = document.getElementById("author");
const poemElement = document.getElementById("poem");
const counterElement = document.getElementById("counter");

const hands = [
    document.getElementById("hand1"),
    document.getElementById("hand2")
];

const handStates = hands.map(hand => ({
    element: hand,
    dragging: false,
    x: null,
    y: null,
    touchId: null
}));

function findColumn(row, possibleNames) {
    const keys = Object.keys(row);
    const match = keys.find(key =>
        possibleNames.includes(key.trim().toLowerCase())
    );
    return match ? row[match] : "";
}

async function loadPoems() {
    try {
        const response = await fetch(
            CSV_URL + "&refresh=" + Date.now(),
            { cache: "no-store" }
        );

        if (!response.ok) {
            throw new Error("Kon gedichten niet laden");
        }

        const csv = await response.text();

        const result = Papa.parse(csv, {
            header: true,
            skipEmptyLines: "greedy"
        });

        poems = result.data.map(row => ({
            title: findColumn(row, ["titel", "title"]),
            author: findColumn(row, ["dichter", "auteur", "author"]),
            poem: findColumn(row, ["gedicht", "tekst", "poem"])
        })).filter(item => item.poem && item.poem.trim());

        if (poems.length > 0) {
            show(0);
        }

    } catch (error) {
        poemElement.textContent = "De gedichten konden niet worden geladen.";
        console.error(error);
    }
}

function show(direction) {
    if (!poems.length) return;

    currentIndex =
        (currentIndex + direction + poems.length) % poems.length;

    const item = poems[currentIndex];

    titleElement.textContent = item.title || "";
    authorElement.textContent = item.author || "";
    poemElement.innerHTML = "";

    const paragraphs = item.poem
        .trim()
        .split(/\n\s*\n/)
        .filter(part => part.trim());

    paragraphs.forEach(text => {
        const paragraph = document.createElement("p");
        paragraph.className = "poem-paragraph";
        paragraph.textContent = text.trim();
        poemElement.appendChild(paragraph);
    });

    counterElement.textContent =
        (currentIndex + 1) + " / " + poems.length;

    clearMagnification();
}

document.getElementById("previous")
    .addEventListener("click", () => show(-1));

document.getElementById("next")
    .addEventListener("click", () => show(1));

function clearMagnification() {
    document.querySelectorAll(".poem-paragraph.active")
        .forEach(element => element.classList.remove("active"));
}

function circleTouchesRectangle(cx, cy, radius, rect) {
    const nearestX = Math.max(rect.left, Math.min(cx, rect.right));
    const nearestY = Math.max(rect.top, Math.min(cy, rect.bottom));

    const dx = cx - nearestX;
    const dy = cy - nearestY;

    return (dx * dx + dy * dy) <= radius * radius;
}

function updateMagnification() {
    const paragraphs = Array.from(
        poemElement.querySelectorAll(".poem-paragraph")
    );

    const activeParagraphs = new Set();

    handStates.forEach(state => {
        if (state.x === null || state.y === null) return;

        let target = null;
        let nearestDistance = Infinity;

        paragraphs.forEach(paragraph => {
            const rect = paragraph.getBoundingClientRect();

            if (circleTouchesRectangle(state.x, state.y, 21, rect)) {
                const centerX = (rect.left + rect.right) / 2;
                const centerY = (rect.top + rect.bottom) / 2;
                const distance = Math.hypot(
                    state.x - centerX,
                    state.y - centerY
                );

                if (distance < nearestDistance) {
                    nearestDistance = distance;
                    target = paragraph;
                }
            }
        });

        if (target) activeParagraphs.add(target);
    });

    paragraphs.forEach(paragraph => {
        paragraph.classList.toggle(
            "active",
            activeParagraphs.has(paragraph)
        );
    });
}

function moveHand(state, x, y) {
    state.x = x;
    state.y = y;

    const hand = state.element;
    hand.style.left = (x - hand.offsetWidth / 2) + "px";
    hand.style.top = (y - hand.offsetHeight / 2) + "px";
    hand.style.right = "auto";

    updateMagnification();
}

/* Touchbediening met onafhankelijke vingerregistratie */

handStates.forEach(state => {
    state.element.addEventListener("touchstart", event => {
        event.preventDefault();

        const touch = event.changedTouches[0];
        state.touchId = touch.identifier;
        state.dragging = true;

        state.element.classList.add("dragging");
        moveHand(state, touch.clientX, touch.clientY);
    }, { passive: false });
});

document.addEventListener("touchmove", event => {
    const activeStates = handStates.filter(state => state.dragging);
    if (!activeStates.length) return;

    event.preventDefault();

    activeStates.forEach(state => {
        const touch = Array.from(event.touches).find(
            t => t.identifier === state.touchId
        );

        if (touch) {
            moveHand(state, touch.clientX, touch.clientY);
        }
    });
}, { passive: false });

document.addEventListener("touchend", event => {
    handStates.forEach(state => {
        const ended = Array.from(event.changedTouches).some(
            t => t.identifier === state.touchId
        );

        if (ended) {
            state.dragging = false;
            state.touchId = null;
            state.element.classList.remove("dragging");
        }
    });
});

document.addEventListener("touchcancel", () => {
    handStates.forEach(state => {
        state.dragging = false;
        state.touchId = null;
        state.element.classList.remove("dragging");
    });
});

/* Muisbediening op MacBook */

handStates.forEach(state => {
    state.element.addEventListener("mousedown", event => {
        event.preventDefault();

        state.dragging = true;
        state.element.classList.add("dragging");

        moveHand(state, event.clientX, event.clientY);
    });
});

document.addEventListener("mousemove", event => {
    handStates.forEach(state => {
        if (state.dragging) {
            moveHand(state, event.clientX, event.clientY);
        }
    });
});

document.addEventListener("mouseup", () => {
    handStates.forEach(state => {
        state.dragging = false;
        state.element.classList.remove("dragging");
    });
});

loadPoems();
setInterval(loadPoems, 5 * 60 * 1000);
</script>

</body>
</html>
